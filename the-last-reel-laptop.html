function fit(){
  const vw=Math.max(320,innerWidth),vh=Math.max(240,innerHeight);
  H=RH;
  W=Math.round(Math.min(1560,Math.max(880,H*(vw/vh))));
  DPR=LOW?1:Math.min(devicePixelRatio||1,2,2600/W);
  CV.width=Math.round(W*DPR);CV.height=Math.round(H*DPR);
  const s=Math.min(vw/W,vh/H);
  CV.style.width=Math.round(W*s)+'px';CV.style.height=Math.round(H*s)+'px';
}

    }
  }
};

function ink(w){X.strokeStyle=P.ink;X.lineWidth=w||5;X.lineJoin='round';X.lineCap='round';}
function hose(x1,y1,x2,y2,bend,w,col){
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  X.beginPath();X.moveTo(x1,y1);X.quadraticCurveTo(mx+nx*bend,my+ny*bend,x2,y2);
  ink((w||9)+5);X.stroke(); X.strokeStyle=col||P.cream;X.lineWidth=w||9;X.stroke();
}
function glove(x,y,r,rot,col){
  X.save();X.translate(x,y);X.rotate(rot||0);
  X.beginPath();X.ellipse(0,0,r,r*.86,0,0,7);X.fillStyle=col||P.glove;X.fill();ink(4);X.stroke();
  X.beginPath();X.moveTo(-r*.5,r*.5);X.quadraticCurveTo(0,r*.15,r*.5,r*.5);ink(2.6);X.stroke();X.restore();
}
function flame(cx,cy,w,h,seed,coreCol,midCol){
  // teardrop flame with a wobbling tip
  const wob=Math.sin(G.t*9+seed)*w*.12, wob2=Math.cos(G.t*7+seed*1.7)*w*.08;
  X.beginPath();
  X.moveTo(cx-w*.5,cy);
  X.bezierCurveTo(cx-w*.62,cy-h*.4, cx-w*.34+wob2,cy-h*.72, cx+wob,cy-h);
  X.bezierCurveTo(cx+w*.34+wob2,cy-h*.72, cx+w*.62,cy-h*.4, cx+w*.5,cy);
  X.bezierCurveTo(cx+w*.4,cy+h*.16, cx-w*.4,cy+h*.16, cx-w*.5,cy);
  X.closePath();
  const g=X.createLinearGradient(cx,cy+h*.1,cx,cy-h);
  g.addColorStop(0,midCol||P.flmDeep);g.addColorStop(.55,coreCol||P.flmMid);g.addColorStop(1,P.flmHot);
  X.fillStyle=g;X.fill();
}
function botEye(x,y,r,lx,ly,blink){
  // glow halo
  X.save();X.globalAlpha=.5+Math.sin(G.t*6)*.18;
  X.beginPath();X.arc(x,y,r*1.7,0,7);X.fillStyle=P.eyeGlow;X.fill();X.restore();
  // socket
  X.beginPath();X.ellipse(x,y,r*1.15,r*1.2,0,0,7);X.fillStyle=P.botDark;X.fill();ink(3.2);X.stroke();
  // glowing lens
  X.beginPath();X.ellipse(x,y,r,r*(blink?.14:1),0,0,7);X.fillStyle=P.eye;X.fill();
  if(!blink){X.save();X.globalAlpha=.9;
    X.beginPath();X.arc(x+lx*r*.4-r*.28,y+ly*r*.4-r*.28,r*.4,0,7);X.fillStyle=P.eyeHi;X.fill();X.restore();}
  ink(2.6);X.stroke();
}
function pieEye(x,y,r,lx,ly,blink){
  X.beginPath();X.ellipse(x,y,r,r*(blink?.12:1.12),0,0,7);X.fillStyle=P.glove;X.fill();ink(3.4);X.stroke();
  if(blink)return;
  const px=x+lx*r*.28,py=y+ly*r*.3;
  X.save();X.beginPath();X.ellipse(x,y,r,r*1.12,0,0,7);X.clip();
  X.beginPath();X.moveTo(px,py);X.arc(px,py,r*.72,-.35,Math.PI*1.62);X.closePath();
  X.fillStyle=P.ink;X.fill();X.restore();
}
function shadowEllipse(x,y,rx,ry){X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);X.fillStyle=P.shadow;X.fill();}
function poster(txt,x,y,size,col,rot,wob){
  X.save();X.translate(x,y);X.rotate(rot||0);
  X.font='900 '+size+'px "Bookman Old Style","Rockwell",Georgia,serif';
  X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';
  if(wob){
    const chs=txt.split('');let total=0;chs.forEach(ch=>total+=X.measureText(ch).width);
    let cx=-total/2;
    chs.forEach((ch,i)=>{const w=X.measureText(ch).width;
      X.save();X.translate(cx+w/2,Math.sin(G.t*7+i*.9)*size*.09);X.rotate(Math.sin(G.t*5+i)*.07);
      X.lineWidth=size*.22;X.strokeStyle=P.ink;X.strokeText(ch,0,0);
      X.fillStyle=col||P.cream;X.fillText(ch,0,0);X.restore();cx+=w;});
  }else{
    X.lineWidth=size*.2;X.strokeStyle=P.ink;X.strokeText(txt,0,0);
    X.fillStyle=col||P.cream;X.fillText(txt,0,0);
  }
  X.restore();
}
function label(txt,x,y,size,col,align){
  X.save();X.font='700 '+size+'px Georgia,serif';X.textAlign=align||'center';X.textBaseline='middle';
  X.lineWidth=size*.3;X.lineJoin='round';X.strokeStyle='rgba(22,16,10,.9)';X.strokeText(txt,x,y);
  X.fillStyle=col||P.cream;X.fillText(txt,x,y);X.restore();
}
function panel(x,y,w,h,rot){
  X.save();X.translate(x,y);X.rotate(rot||0);
  X.beginPath();X.rect(-w/2,-h/2,w,h);X.fillStyle='rgba(38,26,17,.95)';X.fill();ink(6);X.stroke();
  X.beginPath();X.rect(-w/2+9,-h/2+9,w-18,h-18);X.strokeStyle=P.gold;X.lineWidth=2.5;X.stroke();
  X.restore();
}
function wrapLines(txt,size,maxw){
  X.save();X.font='700 '+size+'px Georgia,serif';
  const words=txt.split(' '),lines=[];let cur='';
  words.forEach(w=>{const test=cur?cur+' '+w:w;
    if(X.measureText(test).width>maxw&&cur){lines.push(cur);cur=w;}else cur=test;});
  if(cur)lines.push(cur);X.restore();return lines;
}

const parts=[],pops=[];
/* scale particle counts down in perf mode, and refuse to overfill */

const PART_CAP=260;
function bits(x,y,n,type,col,spd,size,up){

function splat(x,y,n,col,spd,size){
  if(parts.length>PART_CAP)return;
  const c=col||'rgba(36,28,20,.9)';
  n=pc(n||10);
  for(let i=0;i<n;i++){
    const a=Math.random()*7,s=(spd||200)*(.35+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,
      r:(size||9)*(.5+Math.random()),life:.34+Math.random()*.3,max:.64,
      t:'splat',seed:Math.random()*97,col:c,grav:1});
  }

    const a=Math.random()*7,s=(spd||200)*.3;

function stars(x,y,n,col){

}
function confetti(n){
  n=pc(n);
  for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*300,vx:(Math.random()-.5)*70,vy:70+Math.random()*130,

function pop(txt,x,y,col,size){pops.push({txt,x,y,col:col||P.gold,size:size||34,life:.95,max:.95});}
function dmgNum(x,y,amt,crit){
  pops.push({txt:''+Math.round(amt),x:x+(Math.random()-.5)*14,y:y-6,
    col:crit?P.eyeHi:(amt>=12?P.gold:P.cream),size:crit?30:(14+Math.min(amt,20)),
    life:.7,max:.7,dmg:1,vy:-70-Math.min(amt*2,40),vx:(Math.random()-.5)*40});}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.t==='smoke'){p.vx*=.94;p.vy=p.vy*.94-26*dt;p.r+=24*dt;}
    else if(p.t==='star'){p.vy+=420*dt;p.rot+=6*dt;}
    else if(p.t==='conf'){p.vy+=60*dt;p.vx+=Math.sin(G.t*3+p.r)*22*dt;p.rot+=p.spin*dt;}
    else if(p.t==='splat'){p.vy+=760*dt;p.vx*=.97;}
    else if(p.t==='gear'){p.vy+=560*dt;p.vx*=.99;p.rot+=(p.spin||5)*dt;}
    else if(p.t==='shard'){p.vy+=640*dt;p.rot+=(p.spin||4)*dt;}
    else if(p.t==='note'){p.vy+=90*dt;p.vy*=.98;p.x+=Math.sin(G.t*4+p.seed)*22*dt;p.rot+=1.2*dt;}
    else if(p.t==='frame'){p.vy+=300*dt;p.vx*=.98;p.rot+=(p.spin||3)*dt;}
    else if(p.t==='blot'){p.vx*=.86;p.r+=6*dt;}
    if(p.life<=0)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.life-=dt;
    if(q.dmg){q.x+=(q.vx||0)*dt;q.y+=(q.vy||0)*dt;q.vy=(q.vy||0)+300*dt;}
    else q.y-=44*dt;
    if(q.life<=0)pops.splice(i,1);}
}
function drawParts(screenOnly){
  parts.forEach(p=>{
    if(!!p.screen!==!!screenOnly)return;
    const a=Math.max(0,p.life/p.max);X.save();X.globalAlpha=a;
    if(p.t==='smoke'){X.beginPath();
      for(let k=0;k<5;k++){const ang=k/5*7+p.r;X.arc(p.x+Math.cos(ang)*p.r*.42,p.y+Math.sin(ang)*p.r*.42,p.r*.52,0,7);}
      X.fillStyle=p.col;X.fill();X.strokeStyle='rgba(36,28,20,.35)';X.lineWidth=2;X.stroke();}
    else if(p.t==='star'){X.translate(p.x,p.y);X.rotate(p.rot);X.beginPath();
      for(let k=0;k<10;k++){const R=k%2?p.r*.42:p.r,ang=k/10*Math.PI*2-Math.PI/2;
        k?X.lineTo(Math.cos(ang)*R,Math.sin(ang)*R):X.moveTo(Math.cos(ang)*R,Math.sin(ang)*R);}
      X.closePath();X.fillStyle=p.col;X.fill();ink(2.4);X.stroke();}
    else if(p.t==='gear'){
      X.translate(p.x,p.y);X.rotate(p.rot);
      X.beginPath();for(let k=0;k<10;k++){const a=k/10*7,rr=k%2?p.r*.62:p.r;
        const px=Math.cos(a)*rr,py=Math.sin(a)*rr;k?X.lineTo(px,py):X.moveTo(px,py);}
      X.closePath();X.fillStyle=p.col;X.fill();ink(2);X.stroke();
      X.beginPath();X.arc(0,0,p.r*.3,0,7);X.fillStyle='rgba(36,28,20,.5)';X.fill();}
    else if(p.t==='shard'){
      X.translate(p.x,p.y);X.rotate(p.rot);
      X.beginPath();X.moveTo(0,-p.r);X.lineTo(p.r*.42,p.r*.5);X.lineTo(-p.r*.42,p.r*.7);X.closePath();
      X.fillStyle=p.col;X.fill();ink(1.8);X.stroke();
      X.save();X.globalAlpha=a*.5;X.beginPath();X.moveTo(0,-p.r*.7);X.lineTo(p.r*.16,p.r*.2);
      X.lineTo(-p.r*.16,p.r*.2);X.closePath();X.fillStyle=P.cream;X.fill();X.restore();}
    else if(p.t==='note'){
      X.translate(p.x,p.y);X.rotate(p.rot);
      X.beginPath();X.ellipse(0,0,p.r*.6,p.r*.44,-.3,0,7);X.fillStyle=p.col;X.fill();ink(2);X.stroke();
      X.beginPath();X.moveTo(p.r*.52,p.r*.1);X.lineTo(p.r*.52,-p.r*1.5);
      X.strokeStyle=p.col;X.lineWidth=2.6;X.stroke();
      X.beginPath();X.moveTo(p.r*.52,-p.r*1.5);X.quadraticCurveTo(p.r*1.3,-p.r*1.2,p.r*.9,-p.r*.6);
      X.lineWidth=3;X.stroke();}
    else if(p.t==='frame'){
      X.translate(p.x,p.y);X.rotate(p.rot);
      X.beginPath();X.rect(-p.r*.6,-p.r,p.r*1.2,p.r*2);X.fillStyle=p.col;X.fill();ink(1.8);X.stroke();
      X.save();X.globalAlpha=a*.55;X.fillStyle=P.lens;
      X.fillRect(-p.r*.34,-p.r*.72,p.r*.68,p.r*1.44);X.restore();
      X.fillStyle='rgba(36,28,20,.7)';
      for(let k=0;k<3;k++){X.fillRect(-p.r*.56,-p.r*.8+k*p.r*.7,p.r*.14,p.r*.2);
        X.fillRect(p.r*.42,-p.r*.8+k*p.r*.7,p.r*.14,p.r*.2);}}
    else if(p.t==='splat'){
      // a flying ink droplet — irregular blob, stretched along its travel
      X.translate(p.x,p.y);
      const sp=Math.hypot(p.vx,p.vy),ang=Math.atan2(p.vy,p.vx);
      X.rotate(ang);X.scale(1+Math.min(1.6,sp/260),1);
      X.beginPath();
      for(let k=0;k<7;k++){const a=k/7*7,rr=p.r*(.62+((p.seed*(k+3))%10)/16);
        const px=Math.cos(a)*rr,py=Math.sin(a)*rr;k?X.lineTo(px,py):X.moveTo(px,py);}
      X.closePath();X.fillStyle=p.col;X.fill();
      X.strokeStyle='rgba(36,28,20,.5)';X.lineWidth=1.8;X.stroke();}
    else if(p.t==='blot'){
      // a splat that has landed and is soaking in
      X.translate(p.x,p.y);X.rotate(p.rot);
      X.beginPath();
      for(let k=0;k<9;k++){const a=k/9*7,rr=p.r*(.7+((p.seed*(k+2))%10)/14);
        const px=Math.cos(a)*rr,py=Math.sin(a)*rr*.45;k?X.lineTo(px,py):X.moveTo(px,py);}
      X.closePath();X.fillStyle=p.col;X.fill();

    else{X.translate(p.x,p.y);X.rotate(p.rot);X.fillStyle=p.col;X.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
      ink(1.4);X.strokeRect(-p.r/2,-p.r/4,p.r,p.r/2);}
    X.restore();});
  if(screenOnly)pops.forEach(q=>{const a=Math.min(1,q.life/q.max*1.6);

    else{const s=q.size*(1+(1-q.life/q.max)*.35);
      X.save();X.globalAlpha=a;poster(q.txt,q.x,q.y,s,q.col,Math.sin(q.life*8)*.08);X.restore();}});
}

function drawSparky(){

const ROOM_IDS=Object.keys(ROOMS);
/* --- grow the world: every room gets longer and busier, at runtime, so the
       hand-tuned gate geometry in H3 stays exactly as measured. --------- */
(function growWorld(){
  const AREA_MOBS={
    lot:['weevil','sprout'], garden:['sprout','weevil'], sea:['nipper','bubbler'],
    bigtop:['balloon','juggler'], booth:['wisp','gloom'], pixel:['glitch','spriteBat'],
    lava:['magmite','furnace'], nether:['gloom','snip'],
    swamp:['nipper','gloom'], attic:['juggler','glitch'], frost:['bubbler','wisp'],
    storm:['spriteBat','glitch'], vault:['gloom','wisp'],
    mirror:['shard','mimic'], paint:['blotter','brushjack']
  };
  const FLYER={bubbler:1,balloon:1,wisp:1,glitch:1,spriteBat:1,gloom:1,snip:1,shard:1,brushjack:1};
  const oldW={},ext={};
  let n=0;
  const rnd=(seed)=>{const x=Math.sin(seed*127.1)*43758.5453;return x-Math.floor(x);};
  for(const id in ROOMS){
    const r=ROOMS[id];
    const isBoss=(r.boss!==undefined&&r.boss!==null);
    oldW[id]=r.w;
    if(id==='H3'||id==='SCREEN'||id==='RUSH'){ext[id]=0;continue;}   // hub / screening room / arena: untouched
    // BOSS ARENAS: left completely alone (no growth, no traps, no extra mobs)
    if(isBoss){ext[id]=0;n++;continue;}
    const E=1500;                                  // much longer rooms
    ext[id]=E;
    const tall=(r.h||RH)>RH, fy=tall?FT:FL;
    // extend the ground that reaches the old right edge (or lay new ground)
    let extended=false;
    r.plats.forEach(p=>{
      if(p[4]===0&&p[1]===fy&&Math.abs(p[0]+p[2]-r.w)<2){p[2]+=E;extended=true;}
    });
    if(!extended)r.plats.push([r.w,fy,E,92,0]);
    const mobs=AREA_MOBS[r.area]||['weevil'];
    r.enemies=r.enemies||[];
    // ── DENSE platform field across the whole new stretch ──
    const startX=r.w;
    const steps=8+Math.floor(rnd(n+3)*4);          // 8-11 platforms in the new area
    let lastY=fy-120;
    for(let k=0;k<steps;k++){
      const px=startX+80+k*(E-200)/steps + (rnd(n*7+k)-.5)*60;
      // vary height in a climbable staircase pattern
      const tier=Math.floor(rnd(n*17+k)*4);
      const py=fy-90-tier*95;
      const pw=120+Math.floor(rnd(n*23+k)*90);
      // mostly one-way platforms; a few solid; occasional breakable (type 3)
      let ptype=1;
      const roll=rnd(n*41+k);
      if(roll>.85)ptype=3;                          // breakable
      else if(roll>.7)ptype=0;                      // solid ledge
      r.plats.push([Math.round(px),Math.round(py),pw,24,ptype]);
      lastY=py;
      // small floating stepping platform between tiers sometimes
      if(rnd(n*53+k)>.6){
        r.plats.push([Math.round(px+pw*.5),Math.round(py-70),80,20,1]);
      }
    }
    // ── extra platforms back in the ORIGINAL stretch too (denser everywhere) ──
    const origSteps=3+Math.floor(rnd(n*61)*3);
    for(let k=0;k<origSteps;k++){
      const px=120+k*(oldW[id]-240)/Math.max(1,origSteps) + (rnd(n*67+k)-.5)*50;
      const tier=Math.floor(rnd(n*71+k)*3);
      const py=fy-110-tier*90;
      if(px>60&&px<oldW[id]-140)
        r.plats.push([Math.round(px),Math.round(py),110+Math.floor(rnd(n*73+k)*60),22,1]);
    }
    // ── TRAPS: spike strips (type 2) on the ground gaps, non-boss only ──
    const nTraps=2+Math.floor(rnd(n*79)*3);         // 2-4 spike traps
    for(let k=0;k<nTraps;k++){
      const tx=startX+220+k*(E-440)/nTraps + (rnd(n*83+k)-.5)*80;
      const tw=70+Math.floor(rnd(n*89+k)*70);
      // sit the spikes on the floor
      r.plats.push([Math.round(tx),fy-14,tw,16,2]);
    }
    // a couple of spike traps in the original stretch as well
    if(!tall){
      const ot=1+Math.floor(rnd(n*91)*2);
      for(let k=0;k<ot;k++){
        const tx=200+k*(oldW[id]-400)/Math.max(1,ot)+(rnd(n*93+k)-.5)*60;
        if(tx>120&&tx<oldW[id]-160)
          r.plats.push([Math.round(tx),fy-14,60+Math.floor(rnd(n*97+k)*50),16,2]);
      }
    }
    // ── WAY more enemies, spread through the whole room ──
    const density=Math.max(4,Math.round((r.w+E)/380));   // scales with length
    for(let k=0;k<density;k++){
      const t=mobs[Math.floor(rnd(n*101+k)*mobs.length)];
      const fly=FLYER[t];
      const ex=140+k*(r.w+E-280)/density + (rnd(n*103+k)-.5)*120;
      // place ground mobs on the floor, flyers up in the air
      const ey=fly?(fy-160-Math.floor(rnd(n*107+k)*3)*90):fy;
      r.enemies.push([t,Math.round(Math.max(80,Math.min(r.w+E-80,ex))),ey]);
    }
    // Move exits so they stay at the room's ENDS, never stranded mid-room.
    // An 'edge' door in the right half of the old room is a right-wall exit:
    // push it out to the new right wall. Left-half edge doors stay put.
    // 'portal' doors (press-UP hub doorways) are intentional and never move.
    const oldRight=r.w;
    (r.doors||[]).forEach(d=>{
      if(d.kind==='portal'||d.kind==='climb')return;   // portals & climb passages stay fixed
      const dcx=d.x+(d.w||40)/2;
      if(dcx>oldRight*0.5)d.x+=E;   // belongs to the right wall -> follow it out
    });
    r.w+=E;
    // Relocate floor-holes to the RIGHT END of the room (just before the wall exit),
    // so they're only reached at the end — never stranded mid-room.
    (function moveHolesToEnd(){
      const holes=(r.doors||[]).filter(d=>d.kind==='hole'||d.kind==='hatch');
      if(!holes.length)return;
      // find the right-wall edge exit (if any) to sit just left of it
      let rightEdgeX=r.w;
      (r.doors||[]).forEach(d=>{if(d.kind==='edge'&&(d.x+(d.w||40))>r.w-260)rightEdgeX=Math.min(rightEdgeX,d.x);});
      // stack multiple holes leftward from the end so they don't overlap
      let cursor=rightEdgeX-40;
      holes.forEach((h,hi)=>{
        const hw=h.w||120;
        cursor-=hw+40;
        h.x=Math.max(120,Math.round(cursor));
        // make sure solid floor exists under the hole's landing sides; the ground
        // plat already spans the room, so nothing else needed.
      });
    })();
    n++;
  }
  // any spawn point that meant "the right-hand end of that room" follows it out
  for(const id in ROOMS){
    (ROOMS[id].doors||[]).forEach(d=>{
      if(ext[d.to]&&d.tx>oldW[d.to]-150)d.tx+=ext[d.to];
    });
  }
  // UNIVERSAL: put every floor-hole at the right end of its room, just left of the
  // right-wall exit. Runs for ALL rooms (including the hub and un-grown rooms).
  for(const id in ROOMS){
    const r=ROOMS[id];
    const holes=(r.doors||[]).filter(d=>d.kind==='hole'||d.kind==='hatch');
    if(!holes.length)continue;
    let rightEdgeX=r.w;
    (r.doors||[]).forEach(d=>{if(d.kind==='edge'&&(d.x+(d.w||40))>r.w-300)rightEdgeX=Math.min(rightEdgeX,d.x);});
    let cursor=rightEdgeX-40;
    holes.forEach(h=>{const hw=h.w||120;cursor-=hw+40;h.x=Math.max(120,Math.round(cursor));});
  }
  // safety: never let a spike trap sit where a doorway drops you in, OR under a floor-hole.
  const spawnX={};
  for(const id in ROOMS){
    (ROOMS[id].doors||[]).forEach(d=>{
      if(d.tx!==undefined){(spawnX[d.to]=spawnX[d.to]||[]).push(d.tx);}
    });
  }
  for(const id in ROOMS){
    const r=ROOMS[id];
    const spawns=(spawnX[id]||[]).slice();
    if(r.bench)spawns.push(r.bench[0]);
    // protect a band around each floor-hole in THIS room too
    const holeBands=(r.doors||[]).filter(d=>d.kind==='hole'||d.kind==='hatch').map(d=>[d.x-40,d.x+(d.w||120)+40]);
    r.plats=r.plats.filter(p=>{
      if(p[4]!==2)return true;
      for(const sx of spawns){ if(sx>=p[0]-90&&sx<=p[0]+p[2]+90)return false; }
      for(const [a,b] of holeBands){ if(p[0] < b && p[0]+p[2] > a)return false; }
      return true;
    });
  }
})();

function hash(n){return Math.abs(Math.sin(n*12.9898)*43758.5453)%1;}

function drawSky(area){
  const a=AREA[area];
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,a.s1);g.addColorStop(1,a.s2);
  X.fillStyle=g;X.fillRect(0,0,W,H);
  if(area==='bigtop'){
    X.save();X.translate(W/2,-160);
    for(let i=0;i<22;i++){X.save();X.rotate((i-11)*.1);
      X.beginPath();X.moveTo(-32,0);X.lineTo(32,0);X.lineTo(96,900);X.lineTo(-96,900);X.closePath();
      X.fillStyle=i%2?'#c9a882':'#a3705a';X.fill();X.restore();}
    X.restore();
  }
  if(area==='garden'){
    // faint sunburst
    X.save();X.globalAlpha=.1;X.translate(W*.5,140);
    for(let i=0;i<16;i++){X.rotate(Math.PI*2/16);X.beginPath();X.moveTo(0,0);X.lineTo(760,-46);X.lineTo(760,46);
      X.closePath();X.fillStyle=i%2?P.cream:'transparent';X.fill();}
    X.restore();
    // distant swaying flower stalks along the horizon, gently bobbing
    X.save();X.globalAlpha=.5;
    for(let i=0;i<14;i++){
      const bx=((i*150-G.cam*.08)%(W+300)+W+300)%(W+300)-150;
      const baseY=H*.55, hgt=90+hash(i*3.1)*70;
      const sway=Math.sin(G.t*1.3+i*.9)*14;
      // stalk
      X.beginPath();X.moveTo(bx,baseY);
      X.quadraticCurveTo(bx+sway*.5,baseY-hgt*.5,bx+sway,baseY-hgt);
      X.strokeStyle='#5c7a3a';X.lineWidth=4;X.stroke();
      // leaf
      X.save();X.translate(bx+sway*.5,baseY-hgt*.5);X.rotate(Math.sin(G.t*1.3+i)*.3);
      X.beginPath();X.ellipse(10,0,14,6,0,0,7);X.fillStyle='#6f8f45';X.fill();X.restore();
      // bloom
      X.save();X.translate(bx+sway,baseY-hgt);X.rotate(Math.sin(G.t*1.1+i)*.2);
      for(let p=0;p<6;p++){X.save();X.rotate(p/6*Math.PI*2);
        X.beginPath();X.ellipse(0,-11,6,11,0,0,7);X.fillStyle=['#f091a8','#f8e050','#e8a0c0'][i%3];X.fill();X.restore();}
      X.beginPath();X.arc(0,0,5,0,7);X.fillStyle='#f4d060';X.fill();X.restore();
    }
    X.restore();
    // drifting pollen / petals
    X.save();X.globalAlpha=.45;
    for(let i=0;i<16;i++){
      const px=((i*140+G.t*18-G.cam*.12)%(W+120)+W+120)%(W+120)-60;
      const py=(80+hash(i*2.3)*260 + Math.sin(G.t*1.4+i)*18);
      X.fillStyle=i%2?'#f8e050':'#f0b8cc';
      X.beginPath();X.ellipse(px,py,3,5,Math.sin(G.t+i),0,7);X.fill();}
    X.restore();
  }
  if(area==='booth'){
    X.save();X.globalAlpha=.5;
    for(let k=0;k<3;k++){const y=90+k*130+Math.sin(G.t*.6+k)*10;
      X.beginPath();X.moveTo(-40,y);X.lineTo(W+40,y-30);ink(3);X.strokeStyle='rgba(120,104,80,.5)';X.stroke();}
    X.restore();
  }
  if(area==='pixel'){
    X.save();
    for(let i=0;i<46;i++){
      const px0=((hash(i*7.1)*W*1.4-G.cam*.06)%(W+30)+W+30)%(W+30)-15;
      const py0=Math.floor(hash(i*3.3)*H*.62/6)*6;
      X.globalAlpha=.3+Math.sin(G.t*3+i)*.26;
      X.fillStyle=['#4ce0a0','#f8e050','#f04868','#b06ce0'][i%4];
      X.fillRect(Math.floor(px0/6)*6,py0,6,6);}
    X.restore();
  }
  if(area==='lava'){
    X.save();X.globalAlpha=.25;
    const g2=X.createRadialGradient(W*.5,H*.92,20,W*.5,H*.92,H*.8);
    g2.addColorStop(0,'rgba(240,160,48,.85)');g2.addColorStop(1,'rgba(240,160,48,0)');
    X.fillStyle=g2;X.fillRect(0,0,W,H);X.restore();
    X.save();
    for(let i=0;i<26;i++){
      const ex=((hash(i*5.7)*W+Math.sin(G.t*.7+i)*30)%W+W)%W;
      const ey=(H-((G.t*40+hash(i*2.1)*H*2)%(H+120)));
      X.globalAlpha=.42;X.fillStyle=i%2?'#f0a030':'#e06a22';
      X.beginPath();X.arc(ex,ey,2.4+hash(i)*3,0,7);X.fill();}
    X.restore();
  }
  if(area==='music'){
    X.save();
    // staff lines across the sky, pulsing on the beat
    const pp=1-beatPhase();
    for(let k=0;k<5;k++){X.globalAlpha=.12+pp*.1;
      X.beginPath();X.moveTo(0,90+k*30);X.lineTo(W,90+k*30);
      X.strokeStyle=P.cream;X.lineWidth=2.5;X.stroke();}
    for(let i=0;i<12;i++){
      const nx=((i*210-G.cam*.08+G.t*22)%(W+240)+W+240)%(W+240)-120;
      const ny=96+((i*37)%5)*30;
      X.globalAlpha=.5;X.save();X.translate(nx,ny);X.rotate(Math.sin(G.t*2+i)*.2);
      X.beginPath();X.ellipse(0,0,9,7,-.35,0,7);X.fillStyle=P.gold;X.fill();
      X.beginPath();X.moveTo(7,-2);X.lineTo(7,-26);X.strokeStyle=P.gold;X.lineWidth=3;X.stroke();
      X.restore();}
    X.restore();
  }
  if(area==='sea'){
    // shafts of light from the surface
    X.save();X.globalAlpha=.12;
    for(let i=0;i<6;i++){const lx=((i*260-G.cam*.05)%(W+300)+W+300)%(W+300)-150;
      X.save();X.translate(lx,0);X.rotate(.12+Math.sin(G.t*.4+i)*.02);
      const lg=X.createLinearGradient(0,0,0,H);lg.addColorStop(0,'rgba(200,240,255,.7)');lg.addColorStop(1,'rgba(200,240,255,0)');
      X.fillStyle=lg;X.fillRect(-24,0,48,H);X.restore();}
    X.restore();
    // rising bubbles
    X.save();X.globalAlpha=.4;
    for(let i=0;i<22;i++){
      const bx=((hash(i*7.7)*W*1.3-G.cam*.08+Math.sin(G.t*.6+i)*20)%W+W)%W;
      const by=(H-((G.t*46+hash(i*3.1)*H*2)%(H+80)));
      const r=1.6+hash(i)*3;
      X.beginPath();X.arc(bx,by,r,0,7);X.strokeStyle='rgba(210,240,255,.6)';X.lineWidth=1.4;X.stroke();}
    X.restore();
    // little drifting fish silhouettes far back
    X.save();X.globalAlpha=.25;
    for(let i=0;i<7;i++){
      const dir=i%2?1:-1;
      const fx=((i*300+dir*G.t*30-G.cam*.06)%(W+200)+W+200)%(W+200)-100;
      const fy=120+hash(i*4.1)*260+Math.sin(G.t*1.6+i)*14;
      X.save();X.translate(fx,fy);X.scale(dir,1);
      X.beginPath();X.ellipse(0,0,14,6,0,0,7);X.fillStyle='#2c4a58';X.fill();
      X.beginPath();X.moveTo(-14,0);X.lineTo(-24,-7);X.lineTo(-24,7);X.closePath();X.fill();X.restore();}
    X.restore();
  }
  if(area==='nether'){
    X.save();X.globalAlpha=.4;
    for(let i=0;i<9;i++){
      const sx=((i*230-G.cam*.1)%(W+240)+W+240)%(W+240)-120;
      const sy=-30+hash(i*4.3)*90,len=120+hash(i*2.2)*180;
      X.save();X.translate(sx,sy);X.rotate(Math.sin(G.t*.5+i)*.06);
      X.fillStyle='#2a0e18';X.fillRect(-13,0,26,len);
      X.strokeStyle='rgba(140,36,64,.6)';X.lineWidth=2;
      for(let k=0;k*22<len;k++){X.strokeRect(-10,6+k*22,5,7);X.strokeRect(5,6+k*22,5,7);}
      X.restore();}
    X.restore();
  }
}
function drawParallax(area,cx){
  const a=AREA[area];
  const yo=-(G.camY||0)*.16;
  const layer=(off,amp,col,base,fac)=>{
    const s=cx*fac;base+=yo;
    const STEP=LOW?40:18;
    X.beginPath();X.moveTo(-20,H);
    for(let x=-20;x<=W+20;x+=STEP)
      X.lineTo(x,base+Math.sin((x+s)*.006+off)*amp+Math.sin((x+s)*.017+off*1.7)*amp*.4);
    X.lineTo(W+20,H);X.closePath();X.fillStyle=col;X.fill();ink(4.5);X.stroke();};
  if(area==='sea'){
    layer(.6,26,a.f,300,.12);
    const band=(base,amp,sp,col,fac)=>{X.beginPath();X.moveTo(-20,H);
      for(let x=-20;x<=W+20;x+=14)X.lineTo(x,base+Math.sin((x+cx*fac)*.021+G.t*sp)*amp+Math.sin((x+cx*fac)*.007+G.t*sp*.6)*amp*.7);
      X.lineTo(W+20,H);X.closePath();X.fillStyle=col;X.fill();ink(4);X.stroke();};
    band(352,9,1.4,'#cfd8c8',.2);band(396,11,1.9,a.f,.3);band(438,9,2.5,a.n,.42);
  }else if(area==='booth'){
    layer(.4,18,a.f,320,.14);layer(2.4,14,a.n,404,.3);
    X.save();X.globalAlpha=.25;
    for(let i=0;i<8;i++){const x=((i*260-cx*.35)%(W+280)+W+280)%(W+280)-140;
      X.beginPath();X.rect(x,300,70,180);X.fillStyle='#120e0a';X.fill();
      for(let k=0;k<6;k++){X.beginPath();X.rect(x+8,312+k*28,54,18);X.strokeStyle='rgba(180,160,120,.5)';X.lineWidth=2;X.stroke();}}
    X.restore();
  }else if(area==='pixel'){
    const step=(base,amp,col,fac)=>{const sx=cx*fac;
      X.beginPath();X.moveTo(-60,H+200);
      for(let x=-60;x<=W+60;x+=36){
        const y=base+yo+Math.round(Math.sin((x+sx)*.0032)*2.2+Math.sin((x+sx)*.011)*1.4)*amp;
        X.lineTo(x,y);X.lineTo(x+36,y);}
      X.lineTo(W+60,H+200);X.closePath();X.fillStyle=col;X.fill();ink(4);X.stroke();};
    step(300,15,a.f,.15);step(382,12,a.n,.32);
  }else if(area==='lava'){
    layer(.6,30,a.f,300,.14);layer(2.2,22,a.n,374,.3);
    X.save();X.globalAlpha=.55;
    X.beginPath();X.moveTo(-20,H+200);
    for(let x=-20;x<=W+20;x+=16)X.lineTo(x,436+yo+Math.sin(x*.019+G.t*1.8)*9);
    X.lineTo(W+20,H+200);X.closePath();X.fillStyle='#e06a22';X.fill();
    X.globalAlpha=.35;X.beginPath();X.moveTo(-20,H+200);
    for(let x=-20;x<=W+20;x+=16)X.lineTo(x,458+yo+Math.sin(x*.026-G.t*2.4)*7);
    X.lineTo(W+20,H+200);X.closePath();X.fillStyle='#f8e050';X.fill();X.restore();
  }else if(area==='music'){

function drawPlat(p,area){

    const n=Math.max(2,Math.round(w/28));

const NEWTYPES={glitch:1,spriteBat:1,magmite:1,furnace:1,gloom:1,snip:1};
const MUSICTYPES={notehead:1,horn:1};
const CH2TYPES={leech:1,sporefly:1,cog:1,springjack:1,icicle:1,flurry:1,sparkbat:1,thunderhead:1,reelrat:1,censor:1,shard:1,mimic:1,blotter:1,brushjack:1};
let enemies=[];
function spawnEnemy(type,x,y){
  const s=ESPEC[type];
  enemies.push({type,x,y,hx:x,hy:y,vx:0,vy:0,w:s.w,h:s.h,hp:s.hp,max:s.hp,fly:s.fly,
    cel:s.cel,t:Math.random()*6,cd:.6+Math.random(),flash:0,face:-1,dead:0,ph:Math.random()*7,
    stun:0,spec:s});
}
function enemyBox(e){return {x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h};}

function updateEnemies(dt){
  const room=ROOMS[G.room];
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead>0){e.dead+=dt;if(e.dead>.5){enemies.splice(i,1);}continue;}
    e.t+=dt;if(e.flash>0)e.flash-=dt;e.cd-=dt;
    const px=PL.x,py=PL.y-32,dx=px-e.x,dy=py-e.y,dist=Math.hypot(dx,dy);
    if(!PL.dead&&Math.abs(dx)>4)e.face=dx>0?1:-1;
    // furnace vent cycle: open window you must hit
    if(e.type==='furnace'){e.vent=(e.vent||0)+dt;e.venting=(e.vent%2.6)>1.7;}
    // magmite cool-down cycle: it can't roll forever — it stops and uncurls,
    // and while it's open the shell no longer turns shots away
    if(e.type==='magmite'){e.roll=(e.roll||0)+dt;e.open=(e.roll%3.2)>2.0;}
    // cog: the teeth jam every few seconds — while it's stalled, shots bite
    if(e.type==='cog'){e.roll=(e.roll||0)+dt;e.open=(e.roll%3.4)>2.2;}
    if(e.stun>0){
      e.stun-=dt;e.vx*=Math.pow(.02,dt);if(!e.fly)e.vy+=GRAV*dt;
      moveBody(e,dt,room,false);
      if(PL.slam>0&&rectHit(playerBox(),enemyBox(e)))damageEnemy(e,4,i);
      // bullets still connect while stunned (weak point)
      continue;
    }
    if(MUSICTYPES[e.type])musicEnemyAI(e,dt,dx,dy,dist);
    else if(CH2TYPES[e.type])ch2EnemyAI(e,dt,dx,dy,dist);
    else if(NEWTYPES[e.type])newEnemyAI(e,dt,dx,dy,dist); else
    switch(e.type){
      case 'sprout':
        if(e.grounded&&e.cd<=0&&dist<520){e.vy=-560;e.vx=Math.sign(dx)*180;e.cd=1.3+Math.random()*.6;A.tone(420,A.now(),.1,'square',.05,600);}
        break;
      case 'weevil':
        if(!e.setup){e.vx=-70;e.setup=1;}
        if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
        break;
      case 'nipper':
        if(!e.setup){e.vx=-140;e.setup=1;}
        if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
        if(e.cd<=0&&dist<420&&e.grounded){e.vx=Math.sign(dx)*330;e.cd=2.2;e.dashT=.35;}
        if(e.dashT>0){e.dashT-=dt;if(e.dashT<=0)e.vx=Math.sign(e.vx)*140;}
        break;
      case 'bubbler':
        e.vy=Math.sin(e.t*1.6+e.ph)*40;
        e.vx=Math.sign(dx||1)*Math.min(38,Math.abs(dx)*.2);
        if(e.cd<=0&&dist<560){e.cd=2.1;
          const a=Math.atan2(dy,dx);
          eshot(e.x,e.y-10,Math.cos(a)*150,Math.sin(a)*150,13,'bubble',Math.random()<.35,{col:'#bcd4d8'});
          A.tone(300,A.now(),.16,'sine',.05,520);}
        break;
      case 'balloon':
        e.vx=(px-e.x)*.55;e.vx=Math.max(-90,Math.min(90,e.vx));
        e.vy=((150+Math.sin(e.t*1.2)*26)-e.y)*.9;
        if(e.cd<=0&&Math.abs(dx)<180){e.cd=2.4;
          eshot(e.x,e.y+18,0,120,14,'ball',Math.random()<.3,{grav:520,col:P.red});
          A.tone(220,A.now(),.14,'triangle',.06,120);}
        break;
      case 'juggler':
        e.vx=0;
        if(e.cd<=0&&dist<620){e.cd=1.7;
          for(let k=-1;k<=1;k+=2){
            const vx0=(px-e.x)/1.05+k*40;
            eshot(e.x,e.y-56,vx0,-420,15,'ball',Math.random()<.3,{grav:900,col:P.gold});}
          A.tone(520,A.now(),.12,'triangle',.06,760);}
        break;
      case 'wisp':{
        const sp=78,a=Math.atan2(dy,dx);
        e.vx+=(Math.cos(a)*sp-e.vx)*Math.min(1,dt*1.4);
        e.vy+=(Math.sin(a)*sp-e.vy)*Math.min(1,dt*1.4);
        break;}
    }
    e.hardstop=false;
    if(!e.fly){e.vy+=GRAV*dt;}
    moveBody(e,dt,room,false);
    // contact damage
    const ghosted=(e.type==='gloom'&&!e.solid);
    if(!ghosted&&!PL.dead&&PL.inv<=0&&PL.slam<=0&&!PL.contactArmor&&rectHit(playerBox(),enemyBox(e)))hurtPlayer(e.x);
    if(!ghosted&&PL.slam>0&&rectHit(playerBox(),enemyBox(e)))damageEnemy(e,3.5,i);
  }
}
// dir: +1 shot travelling right, -1 left; melee/slam pass dir 0
function damageEnemy(e,dmg,i,dir,melee){
  const sp=e.spec||{};
  // deflect: shots off the front of an armored shell do nothing but spark
  if(sp.armor&&!melee&&e.stun<=0&&dir!==0&&dir===e.face){
    stars(e.x-e.face*e.w*.4,e.y-e.h*.5,3,'#cfcfcf');A.clank();return;
  }
  // rolling magmite: armored unless stunned, swatted, or uncurled to cool off
  if(sp.rollArmor&&!melee&&e.stun<=0&&!e.hardstop&&!e.open){
    stars(e.x,e.y-e.h*.5,3,'#f0a030');A.clank();return;
  }
  // furnace: only the open hatch is soft
  if(sp.vent&&!e.venting&&e.stun<=0){
    stars(e.x,e.y-e.h*.6,3,'#f0a030');A.clank();return;
  }
  const crit=!!melee&&melee==='dash';
  if(crit)dmg*=(1.8+PL.critBonus);
  dmg*=PL.dmgMul;
  // combo scales meter gain and adds a little damage
  const comboMul=1+Math.min(PL.combo,10)*.04;
  dmg*=comboMul;
  e.hp-=dmg;e.flash=.1;
  dmgNum(e.x,e.y-e.h,dmg,crit);
  // landing a hit builds the combo
  PL.combo=Math.min(PL.combo+1,30);PL.comboT=2.4;
  PL.cards=Math.min(PL.maxcards,PL.cards+dmg*(PL.charmMeter?.02:.0125)*(1+PL.combo*.02)*PL.meterMul);
  // lifesteal: every 12th landed hit heals 1 if you own it and you're hurt
  if(PL.lifesteal>0){PL._hitCt=(PL._hitCt||0)+1;
    if(PL._hitCt%12===0&&PL.hp<PL.maxhp){PL.hp++;pop('+1',PL.x,PL.y-90,P.red,20);}}
  A.hitmark();stars(e.x,e.y-e.h/2,3);
  // balloon: any hit pops it and dumps payload
  if(sp.pop&&e.hp<e.max){e.hp=0;}
  if(e.hp<=0){
    e.dead=.01;G.shake=Math.max(G.shake,6);
    // ink burst — the drawing comes apart in a spray of its own ink
    const tint=ENEMY_INK[e.type]||'rgba(36,28,20,.92)';
    splat(e.x,e.y-e.h/2,14,tint,230,10);
    puff(e.x,e.y-e.h/2,5,'rgba(247,237,212,.55)',120,9);
    stars(e.x,e.y-e.h/2,6);
    G.hitstop=Math.max(G.hitstop,.05);
    if(sp.pop){for(let k=0;k<5;k++){const a=Math.PI*.5+(k-2)*.28;
      eshot(e.x,e.y,Math.cos(a)*160,Math.sin(a)*160,11,'ball',false,{grav:420,col:P.red});}}
    const n=e.cel+Math.floor(Math.random()*2);
    PL.cels+=n;A.coin();pop('+'+n,e.x,e.y-e.h-16,P.gold,22);
    G.kills++;
    if(G.gateOn){
      G.roomKills++;
      if(G.roomKills>=G.roomQuota){
        G.gateOn=false;G.roomCleared[G.room]=true;
        pop('WAY CLEAR!',PL.x,PL.y-120,P.gold,30);A.pickup();
        const rw=ROOMS[G.room].w;
        for(let k=0;k<10;k++)stars(rw-40,FL-40-k*18,2,P.gold);
      }else{
        pop((G.roomQuota-G.roomKills)+' TO GO',PL.x,PL.y-110,P.cream,20);
      }
    }
  }
}
// melee swat: stagger + knockback, and a free hit
function swatEnemy(e,i){
  const sp=e.spec||{};
  e.stun=Math.max(e.stun,sp.rollArmor?1.1:.7);
  e.hardstop=true;
  e.vx=e.face*-260;e.vy=e.fly?-40:-180;
  A.stun();stars(e.x,e.y-e.h*.5,6,P.cream);pop('!',e.x,e.y-e.h-14,P.gold,26);
  damageEnemy(e,7,i,0,true);
  e.hardstop=false;
}

/* ---- new-world enemies: AI ---- */
function newEnemyAI(e,dt,dx,dy,dist){
  switch(e.type){
    case 'glitch':
      e.vx*=.82;e.vy*=.82;
      if(e.cd<=0&&dist<620){
        e.cd=1.5;e.blink=.16;
        const a=Math.atan2(dy,dx);
        e.tpx=e.x+Math.cos(a)*150;e.tpy=e.y+Math.sin(a)*150;
        A.tone(880,A.now(),.05,'square',.05,240);
      }
      if(e.blink>0){e.blink-=dt;
        if(e.blink<=0){e.x=e.tpx;e.y=Math.max(60,e.tpy);
          for(let k=0;k<6;k++)parts.push({x:e.x+(Math.random()-.5)*40,y:e.y+(Math.random()-.5)*40,
            vx:0,vy:0,r:7,life:.24,max:.24,t:'conf',rot:0,spin:0,col:['#4ce0a0','#f04868','#f8e050'][k%3]});}}
      return true;
    case 'spriteBat':
      e.t2=(e.t2||0)+dt;
      e.vx=Math.sign(dx||1)*120;
      e.vy=Math.sin(e.t*4.4+e.ph)*150+(dist<300?Math.sign(dy)*90:0);
      return true;
    case 'magmite':
      if(!e.setup){e.vx=-150;e.setup=1;}
      if(e.open){                      // uncurled, venting heat — it halts, and it's soft
        e.vx*=Math.pow(.01,dt);
        if(Math.random()<.5)parts.push({x:e.x+(Math.random()-.5)*34,y:e.y-14,vx:(Math.random()-.5)*40,vy:-70,
          r:6,life:.5,max:.5,t:'smoke',col:'rgba(240,160,48,.7)'});
        return false;
      }
      if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
      if(dist<520)e.vx=Math.sign(dx)*Math.min(230,Math.abs(e.vx)+60*dt*60);
      if(Math.random()<.3)parts.push({x:e.x+(Math.random()-.5)*30,y:e.y-6,vx:(Math.random()-.5)*30,vy:-40,
        r:5,life:.4,max:.4,t:'smoke',col:'rgba(224,106,34,.6)'});
      return false;
    case 'furnace':
      e.vx=0;
      if(e.cd<=0&&dist<680){e.cd=1.9;
        for(let k=0;k<2;k++){const vx0=(PL.x-e.x)/1.02+(k?60:-60);
          eshot(e.x,e.y-58,vx0,-400,15,'flame',Math.random()<.25,{grav:880,col:'#e06a22'});}
        A.noise(A.now(),.24,.1,600);}
      return false;
    case 'gloom':{
      e.fade=(e.fade||0)+dt;
      const cyc=e.fade%2.9;
      e.solid=cyc>1.2;
      const sp=e.solid?70:34,a=Math.atan2(dy,dx);
      e.vx+=(Math.cos(a)*sp-e.vx)*Math.min(1,dt*1.1);
      e.vy+=(Math.sin(a)*sp-e.vy)*Math.min(1,dt*1.1);
      return true;}
    case 'snip':{
      if(e.drop===undefined){e.drop=0;e.homeY=e.y;}
      if(e.drop===0){
        e.vx=0;e.vy=Math.sin(e.t*2)*14;
        if(Math.abs(dx)<70&&PL.y>e.y){e.drop=1;A.tone(1200,A.now(),.08,'square',.06,300);}
      }else if(e.drop===1){
        e.vx=0;e.vy=740;
        if(e.grounded||e.y>e.homeY+430){e.drop=2;e.rest=.7;G.shake=Math.max(G.shake,4);
          A.noise(A.now(),.12,.1,900);}
      }else{
        e.vx=0;e.rest-=dt;
        if(e.rest<=0){e.vy=-150;if(e.y<=e.homeY){e.y=e.homeY;e.drop=0;e.vy=0;}}
        else e.vy=0;
      }
      return true;}
  }
  return null;
}

    case 'furnace':{

      const venting=e.venting;
      X.beginPath();X.rect(-16,-40,32,22);X.fillStyle='#1a1410';X.fill();ink(3.4);X.stroke();
      X.save();X.globalAlpha=venting?(.85+Math.sin(e.t*20)*.15):(.35+Math.sin(e.t*8)*.15);
      X.beginPath();X.rect(-14,-38,28,18);X.fillStyle=venting?'#ffd060':'#8c2a10';X.fill();X.restore();
      if(venting){X.save();X.globalAlpha=.4;X.beginPath();X.arc(0,-29,26,0,7);X.fillStyle='#f0a030';X.fill();X.restore();
        for(let k=0;k<3;k++){X.save();X.globalAlpha=.5;
          X.beginPath();X.arc((k-1)*10,-44-((e.t*60+k*20)%30),4,0,7);X.fillStyle='#ffd060';X.fill();X.restore();}}

      X.fillStyle=f?P.glove:'#4a3e34';X.fill();ink(4.4);X.stroke();
      X.beginPath();X.ellipse(0,-94,17,7,0,0,7);X.fillStyle='#2a231c';X.fill();ink(3.4);X.stroke();
      for(let k=0;k<3;k++){X.save();X.globalAlpha=.3;
        X.beginPath();X.arc(Math.sin(e.t*2+k)*10,-104-k*18-((e.t*30+k*20)%40),8+k*3,0,7);

    case 'gloom':{

}
/* ================= CHAPTER TWO — new-world enemies ================= */
function ch2EnemyAI(e,dt,dx,dy,dist){
  switch(e.type){
    /* SWAMP */
    case 'leech':                       // crawls the floor, then lunges at you
      if(!e.setup){e.vx=-90;e.setup=1;}
      if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
      if(e.lung>0){e.lung-=dt;if(e.lung<=0)e.vx=Math.sign(e.vx)*90;}
      else if(e.cd<=0&&dist<440&&e.grounded){e.vx=Math.sign(dx)*420;e.cd=2.4;e.lung=.4;
        A.tone(180,A.now(),.1,'sawtooth',.05,90);}
      return false;
    case 'sporefly':{                   // floats, puffs a ring of spores
      e.vy=Math.sin(e.t*1.7+e.ph)*44;
      e.vx=Math.sign(dx||1)*Math.min(40,Math.abs(dx)*.22);
      if(e.cd<=0&&dist<560){e.cd=2.6;
        for(let k=0;k<5;k++){const a=k/5*Math.PI*2;
          eshot(e.x,e.y,Math.cos(a)*130,Math.sin(a)*130,11,'spore',Math.random()<.3,{col:'#9fce6a',grav:80});}
        A.tone(260,A.now(),.16,'sine',.05,360);}
      return true;}
    /* ATTIC */
    case 'cog':                         // armored rolling gear, speeds up near you
      if(!e.setup){e.vx=-160;e.setup=1;}
      if(e.open){                       // teeth jammed — it grinds to a halt, and it's soft
        e.vx*=Math.pow(.02,dt);
        if(Math.random()<.35)stars(e.x+(Math.random()-.5)*28,e.y-18,1,'#ffd070');
        return false;
      }
      if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
      if(dist<540)e.vx=Math.sign(dx)*Math.min(250,Math.abs(e.vx)+70*dt*60);
      return false;
    case 'springjack':{                 // sits coiled, springs straight up to strike
      if(e.spr===undefined){e.spr=0;e.baseY=e.y;}
      if(e.spr===0){e.vx=0;e.vy=0;
        if(Math.abs(dx)<150&&e.cd<=0){e.spr=1;e.cd=2.8;A.tone(700,A.now(),.06,'square',.06,1300);}}
      else if(e.spr===1){e.vy=-620;e.vx=Math.sign(dx)*120;
        if(e.y<e.baseY-230){e.spr=2;}}
      else{e.vx=0;if(e.grounded){e.spr=0;e.y=e.baseY;}}
      return e.spr===1;
    }
    /* FROST */
    case 'icicle':{                     // hangs from ceiling, drops when you're under
      if(e.drop===undefined){e.drop=0;e.homeY=e.y;}
      if(e.drop===0){e.vx=0;e.vy=0;
        if(Math.abs(dx)<64&&PL.y>e.y){e.drop=1;A.tone(1400,A.now(),.05,'triangle',.05,600);}}
      else if(e.drop===1){e.vx=0;e.vy=680;
        if(e.grounded||e.y>e.homeY+460){e.dead=.01;
          for(let k=0;k<4;k++){const a=Math.PI*.5+(k-1.5)*.4;
            eshot(e.x,e.y,Math.cos(a)*140,Math.sin(a)*80,9,'shard',false,{col:'#cfe6f4',grav:300});}
          G.shake=Math.max(G.shake,4);A.noise(A.now(),.1,.1,1400);}}
      return true;}
    case 'flurry':{                     // drifts on the wind, scatters ice shards
      e.vx=Math.cos(e.t*1.3+e.ph)*70+Math.sign(dx||1)*24;
      e.vy=Math.sin(e.t*2.1+e.ph)*54;
      if(e.cd<=0&&dist<540){e.cd=2.3;
        for(let k=-1;k<=1;k++)eshot(e.x,e.y,k*90,150,9,'shard',Math.random()<.3,{col:'#cfe6f4',grav:220});
        A.tone(900,A.now(),.1,'triangle',.05,500);}
      return true;}
    /* STORM */
    case 'sparkbat':{                   // fast erratic dart-flyer
      e.t2=(e.t2||0)+dt;
      e.vx=Math.sign(dx||1)*150+Math.cos(e.t*7)*60;
      e.vy=Math.sin(e.t*6.2+e.ph)*170+(dist<280?Math.sign(dy)*100:0);
      if(Math.random()<.04){for(let k=0;k<3;k++)parts.push({x:e.x+(Math.random()-.5)*30,y:e.y+(Math.random()-.5)*30,
        vx:0,vy:0,r:5,life:.2,max:.2,t:'conf',rot:0,spin:0,col:'#f0d840'});}
      return true;}
    case 'thunderhead':{                // drifting cloud that rains lightning bolts
      e.vx=Math.sign(dx||1)*Math.min(50,Math.abs(dx)*.2);
      e.vy=((130+Math.sin(e.t*1.1)*24)-e.y+ (e.baseY0||(e.baseY0=e.y,0))*0)*0 + Math.sin(e.t*1.4)*30;
      // hover around top third
      e.vy=(160-e.y)* .6 + Math.sin(e.t*1.4)*20;
      if(e.cd<=0&&Math.abs(dx)<260){e.cd=2.0;
        eshot(e.x,e.y+20,0,520,13,'bolt',Math.random()<.3,{col:'#f0d840'});
        A.noise(A.now(),.14,.12,300);A.tone(120,A.now(),.12,'sawtooth',.06,60);}
      return true;}
    /* VAULT */
    case 'reelrat':{                    // fast little scurrier, quick dashes
      if(!e.setup){e.vx=-170;e.setup=1;}
      if(e.blocked||!e.floorAhead){e.vx*=-1;e.blocked=false;}
      if(e.cd<=0&&dist<400&&e.grounded){e.vx=Math.sign(dx)*380;e.cd=1.8;e.dashT=.3;}
      if(e.dashT>0){e.dashT-=dt;if(e.dashT<=0)e.vx=Math.sign(e.vx)*170;}
      return false;}
    case 'censor':{                     // black bar; blocks shots from the front, slow chase
      const a=Math.atan2(dy,dx),sp=48;
      e.vx+=(Math.cos(a)*sp-e.vx)*Math.min(1,dt*1.0);
      e.vy+=(Math.sin(a)*sp-e.vy)*Math.min(1,dt*1.0);
      e.face=dx<0?-1:1;
      if(e.cd<=0&&dist<500){e.cd=2.6;
        const aa=Math.atan2(dy,dx);
        eshot(e.x,e.y,Math.cos(aa)*180,Math.sin(aa)*180,12,'bar',Math.random()<.3,{col:'#20101a'});
        A.tone(150,A.now(),.12,'square',.05,120);}
      return true;}

    /* MIRROR STAGE */
    case 'shard':{                      // hangs still, then knifes at you in a straight dart
      e.t2=(e.t2||0)+dt;
      if(e.dartT>0){                    // mid-dart: committed, fast, straight
        e.dartT-=dt;
        if(e.dartT<=0){e.vx*=.2;e.vy*=.2;e.cd=1.5+Math.random();}
      }else{
        // drift and glint in place, tracking you slowly
        e.vx+=((Math.sign(dx||1)*36+Math.cos(e.t*2.2)*40)-e.vx)*Math.min(1,dt*1.6);
        e.vy+=((Math.sin(e.t*1.8+e.ph)*44)-e.vy)*Math.min(1,dt*1.6);
        if(e.cd<=0&&dist<420){          // wind up, then dart
          e.wind=(e.wind||0)+dt;
          if(e.wind>.45){const a=Math.atan2(dy,dx);
            e.vx=Math.cos(a)*520;e.vy=Math.sin(a)*520;e.dartT=.42;e.wind=0;
            A.tone(880,A.now(),.09,'triangle',.05,1400);}
        }else e.wind=0;
      }
      e.face=dx<0?-1:1;
      return true;}
    case 'mimic':{                      // walks MIRRORED to your input — pushes the opposite way
      if(!e.setup){e.setup=1;e.vx=0;}
      const want=-Math.sign(PL.vx||0)*150;           // opposite of your motion
      e.vx+=(want-e.vx)*Math.min(1,dt*2.2);
      if(e.blocked||!e.floorAhead){e.vx*=-.6;e.blocked=false;}
      e.face=dx<0?-1:1;
      // when you stop, it stops too — and takes a shot
      if(Math.abs(PL.vx)<30&&e.cd<=0&&dist<430&&e.grounded){e.cd=2.2;
        const aa=Math.atan2(dy,dx);
        eshot(e.x,e.y-30,Math.cos(aa)*300,Math.sin(aa)*300,10,'shard',Math.random()<.25,{col:'#c8dce8'});
        A.tone(520,A.now(),.1,'triangle',.05,900);}
      return false;}

    /* PAINT DEPARTMENT */
    case 'blotter':{                    // hops toward you; on landing it splatters
      if(e.grounded){
        if(e.cd<=0){e.cd=1.25+Math.random()*.5;
          e.vy=-470;e.vx=Math.sign(dx||1)*(160+Math.random()*90);e.hopped=1;
          A.tone(200,A.now(),.09,'sine',.05,120);}
        else if(e.hopped){              // just landed from a hop — splash
          e.hopped=0;
          splat(e.x,e.y-6,5,'rgba(224,120,72,.85)',180,8);
          for(let k=-1;k<=1;k+=2)eshot(e.x,e.y-14,k*210,-150,9,'blob',false,{col:'#e07848'});
          A.noise(A.now(),.12,.08,900);}
        else e.vx*=Math.pow(.02,dt);
      }
      e.face=dx<0?-1:1;
      return false;}
    case 'brushjack':{                  // hovers high, sweeps down in an arc and flicks paint
      e.t2=(e.t2||0)+dt;
      if(e.swipeT>0){
        e.swipeT-=dt;
        e.vy+=1500*dt;                  // drops through the sweep
        if(e.swipeT<=0){e.cd=2.3+Math.random();}
      }else{
        const hoverY=(PL.y-190);
        e.vx+=((Math.sign(dx||1)*90+Math.cos(e.t*1.7)*40)-e.vx)*Math.min(1,dt*1.5);
        e.vy+=((hoverY-e.y)*1.6-e.vy)*Math.min(1,dt*1.8);
        if(e.cd<=0&&Math.abs(dx)<220){  // line up above you, then sweep
          e.swipeT=.5;e.vy=120;e.vx=Math.sign(dx||1)*140;
          A.noise(A.now(),.16,.09,1400);
          for(let k=0;k<3;k++)bits(e.x,e.y,1,'conf','#d05478',160,7,60);}
      }
      e.face=dx<0?-1:1;
      return true;}
  }
  return null;
}

function drawCh2Enemy(e,f){

  switch(e.type){
    case 'leech':{
      const seg=6, lung=e.lung>0;

        X.beginPath();X.ellipse(x,y,13-k*1.1,11-k*.9,0,0,7);
        X.fillStyle=f?P.glove:(k%2?'#3a5a24':'#4e7030');X.fill();ink(3.2);X.stroke();
      }

      pieEye(-7,-24,4.6,0,0,false);pieEye(7,-24,4.6,0,0,false);
      // little wings

      X.rotate(-e.x*.03);
      pieEye(-6,-20,4.4,e.face*.4,0,false);pieEye(6,-20,4.4,e.face*.4,0,false);

      if(e.cd<.5){X.save();X.globalAlpha=.5+Math.sin(G.t*30)*.3;X.strokeStyle='#f0d840';X.lineWidth=3;
        X.beginPath();X.moveTo(0,2);X.lineTo(-5,12);X.lineTo(3,12);X.lineTo(-3,24);X.stroke();X.restore();}
      X.restore();return;}
    case 'reelrat':{
      // body
      X.beginPath();X.ellipse(0,-12,22,12,0,0,7);X.fillStyle=f?P.glove:'#5a4a5a';X.fill();ink(3.4);X.stroke();
      // ears

      X.beginPath();X.arc(20,-10,3,0,7);X.fillStyle='#1a0c14';X.fill();  // nose

      X.strokeStyle=f?P.glove:'#6a5a6a';X.lineWidth=3;
      X.beginPath();X.moveTo(-20,-10);X.quadraticCurveTo(-36,-14+Math.sin(e.t*8)*6,-30,-2);X.stroke();
      // feet scurry
      for(let k=0;k<3;k++){const fx=-10+k*10,fy=-2+Math.abs(Math.sin(e.t*14+k))*3;
        X.beginPath();X.moveTo(fx,-2);X.lineTo(fx,fy);ink(2.2);X.stroke();}
      return;}
    case 'censor':{
      // solid black censor bar
      X.beginPath();X.rect(-28,-24,56,26);X.fillStyle=f?P.glove:'#141018';X.fill();ink(4);X.stroke();
      // "CENSORED" hint dots
      X.save();X.globalAlpha=.5;X.fillStyle='#4a3a44';
      for(let k=0;k<5;k++)X.fillRect(-22+k*10,-14,6,6);X.restore();
      pieEye(-8,-11,4.4,e.face*.4,0,false);pieEye(8,-11,4.4,e.face*.4,0,false);
      // front shield shimmer (shows the armored side)
      X.save();X.globalAlpha=.3+Math.sin(e.t*4)*.15;X.strokeStyle='#d0a0c0';X.lineWidth=2.4;
      X.beginPath();X.moveTo(e.face*28,-24);X.lineTo(e.face*28,2);X.stroke();X.restore();
      return;}

    /* MIRROR STAGE */
    case 'shard':{
      const wind=(e.wind||0)>0, dart=(e.dartT||0)>0;
      X.save();X.translate(0,-22);X.rotate(Math.sin(e.t*2)*.14+(dart?Math.atan2(e.vy,e.vx):0)*.25);
      // glass sliver body
      X.beginPath();X.moveTo(0,-24);X.lineTo(15,4);X.lineTo(3,22);X.lineTo(-13,6);X.closePath();
      const gg=X.createLinearGradient(-14,-24,15,22);
      gg.addColorStop(0,'#eef8ff');gg.addColorStop(.5,f?P.glove:'#a8c4d6');gg.addColorStop(1,'#6a8496');
      X.fillStyle=f?P.glove:gg;X.fill();ink(3.4);X.stroke();
      // inner facet lines
      X.save();X.globalAlpha=.5;X.strokeStyle='#ffffff';X.lineWidth=1.6;
      X.beginPath();X.moveTo(0,-20);X.lineTo(2,16);X.moveTo(-8,2);X.lineTo(10,-2);X.stroke();X.restore();
      // a reflected pair of eyes staring out of the glass
      pieEye(-4,-4,4,e.face*.4,0,false);pieEye(6,-2,4,e.face*.4,0,false);
      // glint that flares when it winds up
      X.save();X.globalAlpha=wind?(.5+Math.sin(G.t*30)*.4):.25;
      X.strokeStyle='#ffffff';X.lineWidth=wind?3:1.8;
      X.beginPath();X.moveTo(-16,-18);X.lineTo(16,14);X.moveTo(16,-18);X.lineTo(-16,14);X.stroke();X.restore();
      X.restore();return;}
    case 'mimic':{
      // a flat grey silhouette of a little fella — your shadow, standing wrong
      X.save();X.scale(-e.face,1);        // deliberately mirrored
      X.beginPath();X.ellipse(0,-42,15,20,0,0,7);X.fillStyle=f?P.glove:'#60707f';X.fill();ink(3.4);X.stroke();
      X.beginPath();X.ellipse(0,-64,12,13,0,0,7);X.fillStyle=f?P.glove:'#60707f';X.fill();ink(3.4);X.stroke();
      // hose arms hanging limp, swinging opposite to its motion
      const sw=Math.sin(e.t*3)*.4;
      hose(-12,-52,-20,-30-sw*8,-9,5.5,f?P.glove:'#60707f');
      hose(12,-52,20,-30+sw*8,9,5.5,f?P.glove:'#60707f');
      hose(-7,-24,-9,-4,-6,5.5,f?P.glove:'#60707f');
      hose(7,-24,9,-4,6,5.5,f?P.glove:'#60707f');
      X.beginPath();X.ellipse(-9,-2,8,4,0,0,7);X.fillStyle='#2a323a';X.fill();
      X.beginPath();X.ellipse(9,-2,8,4,0,0,7);X.fillStyle='#2a323a';X.fill();
      // blank white pie-eyes, no pupils tracking — it copies, it doesn't look
      X.beginPath();X.arc(-5,-66,4.4,0,7);X.fillStyle='#e8f0f6';X.fill();ink(2);X.stroke();
      X.beginPath();X.arc(5,-66,4.4,0,7);X.fillStyle='#e8f0f6';X.fill();ink(2);X.stroke();
      X.restore();
      // faint doubling ghost offset behind it
      X.save();X.globalAlpha=.18;X.translate(e.face*7,0);X.scale(-e.face,1);
      X.beginPath();X.ellipse(0,-42,15,20,0,0,7);X.fillStyle='#c8dce8';X.fill();X.restore();
      return;}

    /* PAINT DEPARTMENT */
    case 'blotter':{
      const squash=e.grounded?1+Math.sin(e.t*8)*.06:.86, stretch=e.grounded?1:1.18;
      X.save();X.translate(0,-18);X.scale(squash,stretch);
      // wobbling blob of paint
      X.beginPath();
      for(let k=0;k<=12;k++){const a=k/12*Math.PI*2;
        const r=22+Math.sin(a*3+e.t*4)*3.4+Math.cos(a*2-e.t*3)*2.4;
        X[k?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r*.86);}
      X.closePath();X.fillStyle=f?P.glove:'#e07848';X.fill();ink(3.6);X.stroke();
      // gloss highlight
      X.save();X.globalAlpha=.35;X.beginPath();X.ellipse(-7,-9,7,4.4,-.4,0,7);X.fillStyle='#ffd2b0';X.fill();X.restore();
      pieEye(-7,-4,5,e.face*.4,0,false);pieEye(7,-4,5,e.face*.4,0,false);
      X.beginPath();X.arc(0,6,6,.2,Math.PI-.2);ink(2.6);X.stroke();
      X.restore();
      // drips hanging off the bottom
      X.save();X.globalAlpha=.7;X.fillStyle=f?P.glove:'#c05a34';
      for(let k=-1;k<=1;k++){const dl=5+Math.sin(e.t*3+k)*3;
        X.beginPath();X.ellipse(k*12,-2+dl,3.4,dl*.8,0,0,7);X.fill();}X.restore();
      return;}
    case 'brushjack':{
      const sweep=(e.swipeT||0)>0;
      X.save();X.translate(0,-30);X.rotate(sweep?e.face*.9:Math.sin(e.t*2)*.16);
      // wooden handle
      X.beginPath();X.rect(-5,-34,10,40);X.fillStyle=f?P.glove:'#b98a4e';X.fill();ink(3.4);X.stroke();
      // metal ferrule
      X.beginPath();X.rect(-9,4,18,12);X.fillStyle=f?P.glove:'#c8c0b0';X.fill();ink(3);X.stroke();
      X.save();X.globalAlpha=.4;X.strokeStyle='#7a7466';X.lineWidth=1.4;
      X.beginPath();X.moveTo(-9,9);X.lineTo(9,9);X.stroke();X.restore();
      // loaded bristles, splayed when sweeping
      const spread=sweep?1.5:1;
      X.beginPath();X.moveTo(-9,16);
      X.quadraticCurveTo(-13*spread,32,-7*spread,40);
      X.lineTo(7*spread,40);X.quadraticCurveTo(13*spread,32,9,16);X.closePath();
      X.fillStyle=f?P.glove:'#d05478';X.fill();ink(3.4);X.stroke();
      // individual bristle strokes
      X.save();X.globalAlpha=.45;X.strokeStyle='#8e2f4c';X.lineWidth=1.6;
      for(let k=-2;k<=2;k++){X.beginPath();X.moveTo(k*4,18);X.lineTo(k*5*spread,38);X.stroke();}X.restore();
      // eyes up on the handle
      pieEye(-4,-24,4.4,e.face*.4,0,false);pieEye(4,-24,4.4,e.face*.4,0,false);
      X.restore();
      // paint flicking off while it sweeps
      if(sweep&&Math.random()<.6){X.save();X.globalAlpha=.7;X.fillStyle='#d05478';
        for(let k=0;k<3;k++){X.beginPath();
          X.arc((Math.random()-.5)*50,-10+Math.random()*30,3,0,7);X.fill();}X.restore();}
      return;}
  }
}

/* tiny pixel-sprite renderer used by the pixel reel */
function pixDraw(rows,cell,pal,ox,oy){
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){
    const ch=rows[r][c];if(ch==='.')continue;
    const col=pal[ch];if(!col)continue;
    X.fillStyle=col;X.fillRect(ox+c*cell,oy+r*cell,cell+.6,cell+.6);
  }
}

  garden: {frame:'#4e6a30',seat:'#6f8f45',accent:'#f091a8',kind:'leaf'},   // living wood + vines

function drawBench(x,y,isSave,area){
  const th=BENCH_THEME[area]||BENCH_THEME.lot;
  X.save();X.translate(x,y);

  if(isSave){X.save();X.globalAlpha=.22+Math.sin(G.t*3)*.12;
    X.beginPath();X.ellipse(0,-30,60,44,0,0,7);X.fillStyle=th.accent;X.fill();X.restore();}
  // ground shadow
  X.save();X.globalAlpha=.2;X.beginPath();X.ellipse(0,2,46,7,0,0,7);X.fillStyle='#000';X.fill();X.restore();

  // ---- legs ----
  const legT=6;
  X.strokeStyle=th.frame;X.lineWidth=legT;X.lineCap='round';
  if(th.kind==='iron'||th.kind==='ghost'){
    // curved ornamental legs

    X.beginPath();X.moveTo(-18,0);X.quadraticCurveTo(-10,-14,-20,-24);X.moveTo(18,0);X.quadraticCurveTo(10,-14,20,-24);X.stroke();

  }

  // ---- seat slab ----
  const seatY=-30,seatW=64,seatH=12;
  X.fillStyle=th.seat;
  X.beginPath();
  if(X.roundRect)X.roundRect(-seatW/2,seatY,seatW,seatH,3);else X.rect(-seatW/2,seatY,seatW,seatH);
  X.fill();ink(4);X.stroke();

  if(th.kind==='stripe'){for(let i=-seatW/2;i<seatW/2;i+=12){X.fillStyle=th.accent;X.globalAlpha=.6;X.fillRect(i,seatY,6,seatH);}}
  else if(th.kind==='plank'||th.kind==='wood'||th.kind==='piano'){X.globalAlpha=.4;X.strokeStyle='#000';X.lineWidth=1;
    for(let i=-seatW/2+8;i<seatW/2;i+=12){X.beginPath();X.moveTo(i,seatY);X.lineTo(i,seatY+seatH);X.stroke();}}
  else if(th.kind==='block'){X.globalAlpha=.5;X.fillStyle=th.frame;for(let i=-seatW/2;i<seatW/2;i+=10)for(let j=seatY;j<seatY+seatH;j+=6)if((i+j)%20<10)X.fillRect(i,j,5,3);}
  else if(th.kind==='velvet'){X.globalAlpha=.25;X.fillStyle='#fff';X.beginPath();X.ellipse(0,seatY+3,seatW*.4,3,0,0,7);X.fill();}
  X.restore();

  // ---- backrest ----
  const backY=-70;
  if(th.kind==='velvet'){
    // tall padded back
    X.beginPath();if(X.roundRect)X.roundRect(-28,backY,56,40,10);else X.rect(-28,backY,56,40);
    X.fillStyle=th.seat;X.fill();ink(4);X.stroke();
    // tufting buttons
    X.fillStyle=th.frame;[[-12,-58],[12,-58],[0,-46]].forEach(p=>{X.beginPath();X.arc(p[0],p[1],2.5,0,7);X.fill();});
  }else if(th.kind==='piano'){
    // low music-stand back with a treble hint
    X.beginPath();X.rect(-26,backY+14,52,10);X.fillStyle=th.seat;X.fill();ink(4);X.stroke();
    X.strokeStyle=th.accent;X.lineWidth=2.5;X.beginPath();X.arc(0,backY+10,7,0,Math.PI*1.6);X.stroke();
  }else if(th.kind==='block'){
    X.fillStyle=th.seat;X.fillRect(-28,backY,56,26);ink(3);X.strokeRect(-28,backY,56,26);
    X.globalAlpha=.5;X.fillStyle=th.accent;for(let i=-28;i<28;i+=10)X.fillRect(i,backY,5,26);X.globalAlpha=1;
  }else{
    // slatted back rail
    X.strokeStyle=th.frame;X.lineWidth=5;
    X.beginPath();X.moveTo(-28,seatY);X.lineTo(-26,backY);X.moveTo(28,seatY);X.lineTo(26,backY);X.stroke();
    for(const ry of [backY+6,backY+16,backY+26]){X.beginPath();X.rect(-26,ry,52,7);X.fillStyle=th.seat;X.fill();ink(3);X.stroke();}
  }

  // ---- themed accents ----
  if(th.kind==='leaf'){ // vines climbing the legs + a bloom
    X.strokeStyle=th.frame;X.lineWidth=2.5;
    X.beginPath();X.moveTo(-28,0);X.quadraticCurveTo(-34,-16,-26,seatY);X.stroke();
    for(let k=0;k<3;k++){X.save();X.translate(-30+Math.sin(k)*4,-8-k*8);X.rotate(k);
      X.beginPath();X.ellipse(0,0,5,2.5,0,0,7);X.fillStyle=th.seat;X.fill();X.restore();}
    X.save();X.translate(26,seatY-2);for(let p=0;p<5;p++){X.save();X.rotate(p/5*Math.PI*2);
      X.beginPath();X.ellipse(0,-5,3,5,0,0,7);X.fillStyle=th.accent;X.fill();X.restore();}
      X.beginPath();X.arc(0,0,2.5,0,7);X.fillStyle=P.gold;X.fill();X.restore();

  }else if(th.kind==='iron'){ // little ember glow under the seat
    X.save();X.globalAlpha=.4+Math.sin(G.t*5)*.2;X.beginPath();X.arc(0,-14,8,0,7);X.fillStyle=th.accent;X.fill();X.restore();
  }else if(th.kind==='ghost'){ // faint flicker
    X.save();X.globalAlpha=.3+Math.sin(G.t*4)*.15;X.strokeStyle=th.accent;X.lineWidth=1.5;
    X.strokeRect(-seatW/2,seatY,seatW,seatH);X.restore();
  }else if(th.kind==='stripe'){ // little pennant
    X.beginPath();X.moveTo(28,backY);X.lineTo(28,backY-18);ink(2.5);X.strokeStyle=th.frame;X.stroke();

  }

  // a little carved "REST" plate on the seat front
  X.save();X.globalAlpha=.9;label('REST',0,seatY+seatH+9,9,th.accent);X.restore();
  X.restore();
}

function musicEnemyAI(e,dt,dx,dy,dist){
  const beat=beatNow();
  if(e.type==='notehead'){
    if(e.lastBeat!==beat){e.lastBeat=beat;

        A.tone(520+((beat%4)*80),A.now(),.1,'triangle',.06,700);}}

  }
  if(e.type==='horn'){

    if(e.lastBeat!==beat){e.lastBeat=beat;
      if(beat%2===0&&dist<700){e.charge=.42;}}
    if(e.charge>0){e.charge-=dt;

    return true;
  }
  return null;
}

   ======================================================================= */

/* the warped bulb body, shared across phases (sc = scale, crack = 0..1) */
function drawTwinBody(f,sc,crack,tone){
  const s=sc||1, base=tone||'#5f7183';
  // bulb silhouette, subtly wrong — bulged on one side
  X.beginPath();X.moveTo(-30*s,10);
  X.bezierCurveTo(-78*s,-60*s,-64*s,-168*s,0,-172*s);
  X.bezierCurveTo(58*s,-168*s,80*s,-56*s,30*s,10);
  X.bezierCurveTo(14*s,24,-14*s,24,-30*s,10);X.closePath();
  const gg=X.createLinearGradient(-70*s,-160*s,70*s,20);
  gg.addColorStop(0,'#e6f2fa');gg.addColorStop(.45,base);gg.addColorStop(1,'#2f3a44');
  X.fillStyle=f?P.glove:gg;X.fill();ink(6);X.stroke();
  // glassy interior shading
  X.save();X.globalAlpha=.26;X.fillStyle='#1e2830';
  X.beginPath();X.ellipse(26*s,-84*s,44*s,86*s,.12,0,7);X.fill();X.restore();
  shine(-40*s,-120*s,20*s,34*s,-.28);
  // cold filament, drawn as a jagged reflection of Sparky's
  X.save();X.strokeStyle='#dff0ff';X.lineWidth=3.4*s;X.globalAlpha=.85;
  X.beginPath();X.moveTo(-20*s,-92*s);X.lineTo(-7*s,-118*s);X.lineTo(4*s,-90*s);
  X.lineTo(16*s,-116*s);X.stroke();X.restore();
  // screw base
  X.beginPath();X.rect(-26*s,10,52*s,26*s);X.fillStyle=f?P.glove:'#8d99a4';X.fill();ink(5);X.stroke();
  for(let k=0;k<3;k++){X.beginPath();X.moveTo(-26*s,16+k*8);X.lineTo(26*s,16+k*8);
    X.strokeStyle='#5a6670';X.lineWidth=2;X.stroke();}
  // cracks spidering across the glass as the fight goes on
  if(crack>0){X.save();X.globalAlpha=Math.min(1,crack);X.strokeStyle='#f2fbff';X.lineWidth=2.4;
    const seeds=[[-30,-120],[18,-96],[-6,-150],[34,-64]];
    seeds.forEach(([sx,sy],i)=>{if(i/seeds.length>crack)return;
      X.beginPath();X.moveTo(sx*s,sy*s);
      for(let k=1;k<=4;k++){const a=i*1.7+k*1.1;
        X.lineTo((sx+Math.cos(a)*k*13)*s,(sy+Math.sin(a)*k*11)*s);}
      X.stroke();});
    X.restore();}
}

/* PHASE 2 — THE UNDERPAINT : flat colour, still wet */
function drawUnderpaint(f){
  const t=B.t;
  // dripping paint vats hanging above
  X.save();
  for(let k=-1;k<=1;k++){const vx=k*118;
    X.beginPath();X.rect(vx-30,-244,60,44);X.fillStyle='#4a2c3e';X.fill();ink(4.5);X.stroke();
    const c=['#4ea0c8','#e0b45c','#c8506a'][k+1];
    X.beginPath();X.rect(vx-26,-206,52,8);X.fillStyle=c;X.fill();
    // a drip stretching down and letting go
    const dl=((t*70+k*40)%110);
    X.save();X.globalAlpha=.85;X.fillStyle=c;
    X.beginPath();X.moveTo(vx-5,-198);X.quadraticCurveTo(vx,-198+dl,vx+5,-198);X.closePath();X.fill();
    X.beginPath();X.arc(vx,-198+dl,5,0,7);X.fill();X.restore();}
  X.restore();
  bossArms(-58,52,'#8a4f5e');
  drawColoristBody(f,1,'#8a4f5e','#5b3040');
  // wet-paint sheen sliding across the smock
  X.save();X.globalAlpha=.2;X.beginPath();
  X.moveTo(-72,16);X.bezierCurveTo(-92,-70,-56,-158,0,-158);
  X.bezierCurveTo(56,-158,92,-70,72,16);X.closePath();X.clip();
  X.fillStyle='#ffd9e4';X.translate(Math.sin(t*1.1)*70,0);X.rotate(-.4);X.fillRect(-26,-190,30,240);X.restore();
  // the face, flat-coloured, no linework in the eyes yet
  X.save();
  for(let sd=-1;sd<=1;sd+=2){X.beginPath();X.arc(sd*26,-110,15,0,7);
    X.fillStyle='#efe4cc';X.fill();ink(4);X.stroke();
    X.beginPath();X.arc(sd*26+B.face*4,-108,6,0,7);X.fillStyle='#3a2230';X.fill();}
  X.restore();
  X.beginPath();X.moveTo(-24,-62);X.quadraticCurveTo(0,-40,24,-62);ink(5);X.stroke();
  // colour still running off the bottom edge
  X.save();X.globalAlpha=.7;
  for(let k=-3;k<=3;k++){const c=['#4ea0c8','#e0b45c','#c8506a','#7fbf5a'][(k+3)%4];
    const dl=14+Math.sin(t*2.4+k)*10;
    X.beginPath();X.moveTo(k*20-5,20);X.quadraticCurveTo(k*20,20+dl,k*20+5,20);X.closePath();
    X.fillStyle=c;X.fill();X.beginPath();X.arc(k*20,20+dl,4,0,7);X.fill();}
  X.restore();
}

/* PHASE 3 — THE COLORIST : finished, furious, fully in colour */
function drawColorist(f){
  const t=B.t;
  // a wheel of colour blazing behind her like a halo
  X.save();X.globalAlpha=.3;X.translate(0,-104);X.rotate(t*.5);
  const wheel=['#c8506a','#e07848','#e0b45c','#7fbf5a','#4ea0c8','#9a6ec8'];
  wheel.forEach((c,i)=>{X.beginPath();X.moveTo(0,0);
    X.arc(0,0,168,i/6*Math.PI*2,(i+1)/6*Math.PI*2);X.closePath();X.fillStyle=c;X.fill();});
  X.restore();
  bossArms(-62,60,'#8a4f5e');
  drawColoristBody(f,1.06,'#a05c6e','#63394c');
  bossFace(-112,'grin',1,1);
  // a loaded palette held out on one arm
  X.save();X.translate(-118+Math.sin(t*1.4)*10,-52+Math.cos(t*1.7)*12);X.rotate(-.3);
  X.beginPath();X.ellipse(0,0,52,34,0,0,7);X.fillStyle='#b98a4e';X.fill();ink(4.5);X.stroke();
  X.beginPath();X.arc(20,6,9,0,7);X.fillStyle='#4a2c3e';X.fill();     // thumb hole
  wheel.forEach((c,i)=>{const a=i/6*Math.PI*2;
    X.beginPath();X.arc(-8+Math.cos(a)*26,Math.sin(a)*16,8,0,7);X.fillStyle=c;X.fill();ink(2.2);X.stroke();});
  X.restore();
  // a big brush in the other hand, dripping
  X.save();X.translate(120+Math.sin(t*1.9)*12,-70+Math.cos(t*1.5)*14);X.rotate(.5+Math.sin(t*3)*.2);
  X.beginPath();X.rect(-7,-64,14,70);X.fillStyle='#b98a4e';X.fill();ink(4);X.stroke();
  X.beginPath();X.rect(-11,4,22,14);X.fillStyle='#c8c0b0';X.fill();ink(3.4);X.stroke();
  X.beginPath();X.moveTo(-11,18);X.quadraticCurveTo(-15,40,-8,50);X.lineTo(8,50);
  X.quadraticCurveTo(15,40,11,18);X.closePath();X.fillStyle='#c8506a';X.fill();ink(3.6);X.stroke();
  X.save();X.globalAlpha=.8;X.fillStyle='#c8506a';
  X.beginPath();X.arc(0,54+((t*90)%26),5,0,7);X.fill();X.restore();
  X.restore();
  // flecks of colour thrown off as she works
  X.save();X.globalAlpha=.65;
  for(let k=0;k<8;k++){const a=t*2+k*.8, rr=150+Math.sin(t*3+k)*24;
    X.beginPath();X.arc(Math.cos(a)*rr,-100+Math.sin(a)*rr*.45,4.4,0,7);
    X.fillStyle=wheel[k%6];X.fill();}
  X.restore();
}

const POWERUPS=[
  {id:'vigor', name:'EXTRA REEL',   desc:'+1 max health, and refill. (one time)',
   apply:()=>{PL.maxhp+=2;PL.hp=PL.maxhp;}, once:true},

   apply:()=>{PL.dmgMul*=1.25;}},
  {id:'rapid', name:'FAST SPROCKET',desc:'You fire noticeably faster.',

  {id:'meter', name:'LIVE WIRE',    desc:'Super meter charges 35% faster.',

   apply:()=>{PL.superCheap=Math.min(3,PL.superCheap+1);}},

   apply:()=>{PL.lifesteal+=1;}},
  {id:'guard', name:'SPARE BULB',   desc:'+1 max health. (one time)',
   apply:()=>{PL.maxhp+=2;PL.hp=Math.min(PL.maxhp,PL.hp+2);}, once:true}
];
function offerPowerups(){
  // choose 3 distinct powerups the player can still take
  const pool=POWERUPS.filter(p=>!(p.once&&PL['_took_'+p.id]));
  const chosen=[];
  const bag=pool.slice();
  while(chosen.length<3&&bag.length){
    const i=Math.floor(Math.random()*bag.length);
    chosen.push(bag.splice(i,1)[0]);
  }
  G.pick={opts:chosen,sel:0};G.pickHold=0;
}
function takePowerup(){
  const p=G.pick.opts[G.pick.sel];
  p.apply();PL['_took_'+p.id]=true;
  A.win&&A.blip();
  pop(p.name+'!',PL.x,PL.y-150,P.gold,30);
  G.pick=null;
  confetti(40);
}
function brokenKey(r,i){return r+':'+i;}

/* ---- geometry ---- */
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function playerBox(){const h=(PL.duck&&PL.grounded)?38:56;return {x:PL.x-13,y:PL.y-h,w:26,h:h};}
function beatOn(p){return ((beatNow()+((p[0]/170)|0))%2)===0;}
function platSolid(p,i){
  const t=p[4];
  if(t===2||t===1)return false;
  if(t===6)return beatOn(p);
  if((t===3||t===4)&&isBroken(p,i))return false;
  return true;
}
function platStandable(p,i){
  const t=p[4];
  if(t===2)return false;
  if(t===6)return beatOn(p);
  if((t===3||t===4)&&isBroken(p,i))return false;
  return true;
}
function moveBody(o,dt,room,isPlayer){
  const hw=o.w/2;
  o.blocked=false;
  o.x+=o.vx*dt;
  if(!o.fly){
    room.plats.forEach((p,i)=>{
      if(!platSolid(p,i)||p[4]===1)return;
      const bx=o.x-hw,by=o.y-o.h;
      if(bx<p[0]+p[2]&&bx+o.w>p[0]&&by<p[1]+p[3]&&by+o.h>p[1]){
        if(o.vx>0)o.x=p[0]-hw-.5;else if(o.vx<0)o.x=p[0]+p[2]+hw+.5;
        o.blocked=true;if(isPlayer)o.vx=0;
      }
    });
  }
  o.x=Math.max(hw+2,Math.min(room.w-hw-2,o.x));
  const prevFeet=o.y,prevTop=o.y-o.h;
  o.y+=o.vy*dt;
  o.grounded=false;
  if(!o.fly){
    room.plats.forEach((p,i)=>{
      if(!platStandable(p,i))return;
      const bx=o.x-hw;
      if(bx+o.w<=p[0]||bx>=p[0]+p[2])return;
      if(o.vy>=0&&prevFeet<=p[1]+4&&o.y>=p[1]){
        if(p[4]===1&&isPlayer&&PL.dropT>0)return;
        o.y=p[1];o.vy=0;o.grounded=true;o.landPlat=i;
      }else if(p[4]!==1&&o.vy<0){
        const top=o.y-o.h;
        if(top<p[1]+p[3]&&top>p[1]&&prevTop>=p[1]+p[3]-4){o.y=p[1]+p[3]+o.h;o.vy=0;}
      }
    });
    // ledge probe for walkers
    if(o.type){
      const ax=o.x+Math.sign(o.vx||1)*(hw+8);
      o.floorAhead=false;
      room.plats.forEach((p,i)=>{
        if(!platStandable(p,i))return;
        if(ax>p[0]&&ax<p[0]+p[2]&&o.y+2>=p[1]&&o.y-2<=p[1]+p[3])o.floorAhead=true;
      });
    }
  }
}

let bullets=[],ebullets=[],beams=[];
function gunPos(){return {x:PL.x+PL.aimx*26,y:PL.y-((PL.duck&&PL.grounded)?22:40)+PL.aimy*20};}
function fireBullet(){
  const g=gunPos();
  const pierce=PL.can.prism?1:0;
  bullets.push({x:g.x,y:g.y,vx:PL.aimx*680,vy:PL.aimy*680,r:7,life:1.1,ex:false,rot:0,pierce,prism:PL.can.prism?1:0});
  // THE UNDERSTUDY: a mirrored pair flanks every shot
  if(PL.can.twin){
    const a=Math.atan2(PL.aimy,PL.aimx);
    for(const off of [-0.13,0.13]){
      const na=a+off;
      bullets.push({x:g.x,y:g.y,vx:Math.cos(na)*640,vy:Math.sin(na)*640,r:5.4,life:.95,
        ex:false,rot:0,pierce,prism:PL.can.prism?1:0,twin:1});
    }
  }
  puff(g.x,g.y,2,'rgba(255,240,200,.8)',60,4);
  PL.recoil=.09;A.shoot();G.shake=Math.max(G.shake,1.3);
}
function fireEX(){

  PL.cards--;PL.superT=.12;const g=gunPos();

  pop('ZAP!',PL.x,PL.y-96,P.gold,38);
}
function eshot(x,y,vx,vy,r,look,pink,extra){
  const col=(B.def&&B.def.col[B.phase-1])||'#9a8256';
  ebullets.push(Object.assign({x,y,vx,vy,r,look:look||'lump',pink:!!pink,life:7,rot:Math.random()*7,t:0,
    col:pink?P.pink:col},extra||{}));
}
function drawEBullets(){
  ebullets.forEach(e=>{
    X.save();X.translate(e.x,e.y);
    if(e.pink){X.save();X.globalAlpha=.3+Math.sin(G.t*14)*.2;
      X.beginPath();X.arc(0,0,e.r+11,0,7);X.fillStyle=P.pink;X.fill();X.restore();}
    const col=e.col;
    switch(e.look){
      case 'ring':
        X.beginPath();X.arc(0,0,e.r,0,7);X.strokeStyle='rgba(224,180,92,.75)';X.lineWidth=11;X.stroke();
        X.save();X.globalAlpha=.5;X.strokeStyle=P.ink;X.lineWidth=3;X.stroke();X.restore();break;
      case 'tear':
        X.rotate(Math.atan2(e.vy,e.vx)-Math.PI/2);
        X.beginPath();X.moveTo(0,-e.r*1.5);X.quadraticCurveTo(e.r,e.r*.5,0,e.r);
        X.quadraticCurveTo(-e.r,e.r*.5,0,-e.r*1.5);X.closePath();
        X.fillStyle=col;X.fill();ink(3);X.stroke();break;
      case 'spark':
        X.rotate(e.rot);X.beginPath();
        for(let k=0;k<12;k++){const R=k%2?e.r*.35:e.r*1.25,a=k/12*Math.PI*2;
          k?X.lineTo(Math.cos(a)*R,Math.sin(a)*R):X.moveTo(Math.cos(a)*R,Math.sin(a)*R);}
        X.closePath();X.fillStyle=e.pink?P.pink:P.gold;X.fill();ink(3);X.stroke();break;
      case 'bubble':
        X.beginPath();X.arc(0,0,e.r,0,7);X.fillStyle=e.pink?'rgba(240,145,168,.6)':'rgba(220,235,235,.5)';
        X.fill();ink(3.4);X.stroke();
        X.beginPath();X.arc(-e.r*.34,-e.r*.34,e.r*.28,0,7);X.fillStyle=P.glove;X.fill();break;
      case 'dart':
        X.rotate(Math.atan2(e.vy,e.vx));
        X.beginPath();X.moveTo(e.r*1.5,0);X.lineTo(-e.r*.6,-e.r*.78);X.lineTo(-e.r*.6,e.r*.78);X.closePath();
        X.fillStyle=col;X.fill();ink(3.2);X.stroke();
        X.beginPath();X.moveTo(-e.r*.6,0);X.lineTo(-e.r*1.6,-e.r*.6);X.moveTo(-e.r*.6,0);X.lineTo(-e.r*1.6,e.r*.6);
        X.strokeStyle=e.pink?P.pink:P.green;X.lineWidth=3.4;X.stroke();break;
      case 'card':
        X.rotate(e.rot*2);
        X.beginPath();X.rect(-e.r*.72,-e.r*1.1,e.r*1.44,e.r*2.2);
        X.fillStyle=e.pink?P.pink:P.glove;X.fill();ink(3.2);X.stroke();
        X.save();X.globalAlpha=.6;X.strokeStyle=P.ink;X.lineWidth=1.6;
        for(let k=0;k<3;k++){X.strokeRect(-e.r*.6,-e.r*.9+k*e.r*.72,e.r*.3,e.r*.3);
          X.strokeRect(e.r*.3,-e.r*.9+k*e.r*.72,e.r*.3,e.r*.3);}X.restore();break;
      case 'note':
        X.rotate(Math.sin(e.rot*2)*.3);
        X.beginPath();X.ellipse(-3,2,e.r*.8,e.r*.6,-.35,0,7);
        X.fillStyle=e.pink?P.pink:(col||P.gold);X.fill();ink(3);X.stroke();
        X.beginPath();X.moveTo(e.r*.6,0);X.lineTo(e.r*.6,-e.r*1.7);ink(3.4);X.stroke();
        X.beginPath();X.moveTo(e.r*.6,-e.r*1.7);X.quadraticCurveTo(e.r*1.7,-e.r*1.3,e.r*1.3,-e.r*.6);
        ink(3);X.stroke();break;
      case 'pixel':
        X.fillStyle=e.pink?P.pink:(col||'#4ce0a0');X.fillRect(-e.r,-e.r,e.r*2,e.r*2);
        X.strokeStyle=P.ink;X.lineWidth=3;X.strokeRect(-e.r,-e.r,e.r*2,e.r*2);
        X.save();X.globalAlpha=.35;X.fillStyle='#fff';X.fillRect(-e.r,-e.r,e.r*2,e.r*.55);X.restore();break;
      case 'flame':
        X.save();X.globalAlpha=.45;X.beginPath();X.arc(0,0,e.r*1.6,0,7);X.fillStyle='#e06a22';X.fill();X.restore();
        X.rotate(Math.atan2(e.vy,e.vx)+Math.PI/2);
        flameShape(0,e.r*.9,e.r*.1,G.t*4+e.rot);
        X.fillStyle=e.pink?P.pink:'#f0a030';X.fill();ink(3);X.stroke();break;
      case 'blade':
        X.rotate(e.rot*3);
        X.beginPath();X.moveTo(0,-e.r*1.45);X.lineTo(e.r*.52,0);X.lineTo(0,e.r*1.45);X.lineTo(-e.r*.52,0);X.closePath();
        X.fillStyle=e.pink?P.pink:'#b9b3a4';X.fill();ink(3.2);X.stroke();
        X.beginPath();X.moveTo(0,-e.r);X.lineTo(0,e.r);X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=2;X.stroke();break;
      case 'ball':
        X.beginPath();X.arc(0,0,e.r,0,7);X.fillStyle=col;X.fill();ink(4);X.stroke();
        X.save();X.beginPath();X.arc(0,0,e.r,0,7);X.clip();X.rotate(e.rot);
        X.fillStyle=e.pink?P.glove:P.cream;X.fillRect(-e.r,-e.r*.24,e.r*2,e.r*.48);X.restore();
        X.beginPath();X.arc(0,0,e.r,0,7);ink(4);X.stroke();break;
      case 'bolt':
        X.rotate(Math.atan2(e.vy,e.vx)-Math.PI/2);
        X.beginPath();X.moveTo(0,-e.r*1.6);X.lineTo(e.r*.5,-e.r*.2);X.lineTo(0,0);
        X.lineTo(e.r*.6,e.r*1.6);X.lineTo(-e.r*.4,e.r*.2);X.lineTo(0,0);X.closePath();
        X.fillStyle=e.pink?P.pink:'#f0d840';X.fill();ink(3);X.stroke();
        X.save();X.globalAlpha=.5;X.fillStyle='#fff6b0';X.fill();X.restore();break;
      case 'bar':
        X.rotate(e.rot*.5);
        X.beginPath();X.rect(-e.r*1.4,-e.r*.5,e.r*2.8,e.r);X.fillStyle=e.pink?P.pink:'#20101a';X.fill();ink(3.2);X.stroke();
        X.save();X.globalAlpha=.4;X.fillStyle='#6a4a5a';for(let k=0;k<4;k++)X.fillRect(-e.r+k*e.r*.7,-e.r*.24,e.r*.34,e.r*.48);X.restore();break;
      case 'spore':
        X.beginPath();X.arc(0,0,e.r,0,7);X.fillStyle=e.pink?P.pink:'#9fce6a';X.fill();ink(3);X.stroke();
        X.save();X.globalAlpha=.6;X.fillStyle='#c4e08a';X.beginPath();X.arc(-e.r*.3,-e.r*.3,e.r*.3,0,7);X.fill();X.restore();break;
      case 'shard':
        X.rotate(Math.atan2(e.vy,e.vx));
        X.beginPath();X.moveTo(e.r*1.4,0);X.lineTo(-e.r*.5,-e.r*.6);X.lineTo(-e.r*.5,e.r*.6);X.closePath();
        X.fillStyle=e.pink?P.pink:'#cfe6f4';X.fill();ink(2.8);X.stroke();break;
      case 'blob':
        X.rotate(e.rot*.6);X.beginPath();
        for(let k=0;k<=10;k++){const a=k/10*Math.PI*2;
          const R=e.r*(1+Math.sin(a*3+G.t*6)*.16);
          X[k?'lineTo':'moveTo'](Math.cos(a)*R,Math.sin(a)*R*.9);}
        X.closePath();X.fillStyle=e.pink?P.pink:(col||'#e07848');X.fill();ink(3.2);X.stroke();
        X.save();X.globalAlpha=.4;X.beginPath();X.ellipse(-e.r*.3,-e.r*.3,e.r*.3,e.r*.2,-.4,0,7);
        X.fillStyle='#ffd2b0';X.fill();X.restore();break;
      default:
        X.rotate(e.rot);X.beginPath();
        for(let k=0;k<8;k++){const R=e.r*(.85+Math.sin(k*3.3)*.18),a=k/8*Math.PI*2;
          k?X.lineTo(Math.cos(a)*R,Math.sin(a)*R):X.moveTo(Math.cos(a)*R,Math.sin(a)*R);}
        X.closePath();X.fillStyle=col;X.fill();ink(4);X.stroke();
    }
    X.restore();
  });
}
const PRISM_COLS=['#c8506a','#e07848','#e0b45c','#7fbf5a','#4ea0c8','#9a6ec8'];
function drawBullets(){
  bullets.forEach(b=>{X.save();X.translate(b.x,b.y);X.rotate(b.rot);
    X.beginPath();
    for(let k=0;k<10;k++){const r=k%2?b.r*.44:b.r,a=k/10*Math.PI*2-Math.PI/2;
      k?X.lineTo(Math.cos(a)*r,Math.sin(a)*r):X.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
    X.closePath();
    const pcol=b.prism?PRISM_COLS[Math.floor((G.t*12+b.x*.05)%6)]:null;
    X.fillStyle=b.ex?P.gold:(pcol||P.cream);X.fill();ink(b.ex?4:2.8);X.stroke();
    if(b.ex){X.beginPath();X.arc(0,0,b.r*.45,0,7);X.fillStyle=P.red;X.fill();ink(2.6);X.stroke();}
    X.restore();});
}
function drawBeams(){
  beams.forEach(bm=>{
    if(bm.warn>0){X.save();X.globalAlpha=.25+Math.sin(G.t*30)*.2;
      X.fillStyle=P.red;X.fillRect(0,bm.y-3,ROOMS[G.room].w,6);X.restore();}
    else{X.save();
      X.globalAlpha=.85;X.fillStyle=P.cream;X.fillRect(0,bm.y-bm.h/2,ROOMS[G.room].w,bm.h);
      X.globalAlpha=.5;X.fillStyle=P.gold;X.fillRect(0,bm.y-bm.h/2-6,ROOMS[G.room].w,bm.h+12);
      X.restore();}
  });
}

const B={x:900,y:FL,phase:1,hp:1,max:1,t:0,state:'idle',stateT:1.4,attack:null,attackT:0,
  flash:0,dying:0,hurt:0,def:null,idx:0,atkClock:0,expose:0,vmode:'open',atkCount:0};
function startBoss(idx){
  const d=BOSSDEF[idx];
  B.def=d;B.idx=idx;B.phase=1;B.hp=d.hp[0];B.max=d.hp[0];B.t=0;B.state='idle';B.stateT=1.9;
  B.attack=null;B.flash=0;B.dying=0;B.hurt=0;B.atkClock=0;B._deathBurst=0;
  B.x=ROOMS[G.room].w*.74;B.y=FL;
  G.bossFight=true;G.dark=0;
  ebullets.length=0;beams.length=0;
  A.startMusic(d.music);
}
function bossBox(){
  const bx=B.def.box[B.phase-1];
  return {x:B.x-bx[0]*.72,y:B.y-bx[1]*.9,w:bx[0]*1.44,h:bx[1]*.9};
}
function bossThink(dt){
  if(B.dying>0)return;
  const d=B.def,room=ROOMS[G.room];
  B.t+=dt;B.stateT-=dt;if(B.flash>0)B.flash-=dt;if(B.hurt>0)B.hurt-=dt*3;
  B.vmode=(d.vuln&&d.vuln[B.phase-1])||'open';
  if(B.expose>0)B.expose-=dt;
  const tx=room.w*.5+Math.sin(B.t*.5)*room.w*.26;
  B.x+=(tx-B.x)*Math.min(1,dt*1.3);
  if(B.state==='idle'&&B.stateT<=0){
    const list=d.pats[B.phase-1];
    let a=list[Math.floor(Math.random()*list.length)];
    if(a===B.attack&&list.length>1)a=list[(list.indexOf(a)+1)%list.length];
    B.attack=a;B.state='windup';B.stateT=Math.max(.32,.58-B.phase*.05);
  }else if(B.state==='windup'){
    if(B.stateT<=0){B.state='attack';B.attackT=0;B.atkClock=0;
      B.stateT=(['rain','ringbeam','bubbles','cards','spiral','grid'].indexOf(B.attack)>=0)?1.6:.9;
      startAttack();}
  }else if(B.state==='attack'){
    B.attackT+=dt;tickAttack(dt);
    if(B.stateT<=0){
      B.state='idle';B.stateT=d.rest[B.phase-1];B.atkCount++;
      // 'tired' phases: the boss over-extends and is briefly exposed after finishing a heavy attack
      if(B.vmode==='tired'){B.expose=d.rest[B.phase-1]+.5;A.stun();
        pop('WORN OUT!',B.x,B.y-d.box[B.phase-1][1]-30,P.gold,24);}
    }
  }
}
function bossVulnerable(){
  if(B.vmode==='open')return true;
  return B.expose>0;                 // 'parry' and 'tired' both gate on the expose timer
}
function startAttack(){
  const d=B.def,L=d.look,px=PL.x,py=PL.y-34,bx=B.x,by=B.y-d.box[B.phase-1][1]*.6;
  const spd=280+B.phase*36+B.idx*24;
  switch(B.attack){
    case 'spit':{const a=Math.atan2(py-by,px-bx);
      for(let k=-1;k<=1;k++)eshot(bx,by,Math.cos(a+k*.12)*spd,Math.sin(a+k*.12)*spd,13,L.spit,k===0&&Math.random()<.4);
      puff(bx,by,6,'rgba(200,180,140,.7)',110,10);A.noise(A.now(),.15,.1,700);break;}
    case 'fan5':{const a0=Math.atan2(py-by,px-bx);
      for(let k=0;k<5;k++){const a=a0+(k-2)*.2;eshot(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,12,L.fan5,k===2);}
      A.noise(A.now(),.18,.1,900);break;}
    case 'sweep':{
      const dir=PL.x<bx?-1:1;
      for(let k=0;k<4;k++)eshot(bx+dir*70,FL-18,dir*(230+k*54),0,20,L.sweep,k===1,{spin:0,ground:1});
      A.noise(A.now(),.3,.12,400,'lowpass');break;}
    case 'lob':{for(let k=0;k<4;k++){const t2=PL.x+(k-1.5)*110,vx=(t2-bx)/1.1;
      eshot(bx,by-30,vx,-400,15,L.lob,k===1,{grav:760,pops:1});}break;}
    case 'pinkring':{const n=10+B.phase*2;

    // ── THE MAESTRO: only fires on the downbeat ──
    case 'downbeat':{

      for(let k=0;k<5;k++){
